<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MAPS = window.MAPS;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 9000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 4;
controls.maxDistance = 3200;
controls.screenSpacePanning = false;

// ---------- sky ----------
const skyUniforms = { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(8000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top, horizon, sunDir, sunCol; varying vec3 vDir;
    void main(){ vec3 d=normalize(vDir); float t=clamp(d.y*1.6,0.0,1.0);
      vec3 c=mix(horizon, top, pow(t,0.7));
      float s=max(dot(d,normalize(sunDir)),0.0);
      c+=sunCol*(pow(s,600.0)*2.5+pow(s,12.0)*0.25);
      gl_FragColor=vec4(c,1.0); }`
}));
sky.renderOrder = -1;
scene.add(sky);
scene.fog = new THREE.Fog(0xcfdde6, 600, 4200);

const hemi = new THREE.HemisphereLight(0xdfeaf5, 0x6b5a3a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.0);
scene.add(sun);

// ---------- clouds ----------
function cloudTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 14; i++) {
    const x = 30 + Math.random() * 68, y = 45 + Math.random() * 38, r = 18 + Math.random() * 26;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const clouds = new THREE.Group(); scene.add(clouds);
const cloudMats = [cloudTexture(), cloudTexture(), cloudTexture()].map(t => new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, opacity: 0.85, fog: true }));
function spawnClouds(w, d) {
  clouds.clear();
  for (let i = 0; i < 70; i++) {
    const s = new THREE.Sprite(cloudMats[i % 3]);
    const sc = 90 + Math.random() * 180;
    s.scale.set(sc, sc * 0.55, 1);
    s.position.set((Math.random() - 0.5) * w * 1.6, 110 + Math.random() * 90, (Math.random() - 0.5) * d * 1.6);
    s.userData.v = 2 + Math.random() * 3;
    clouds.add(s);
  }
  clouds.userData.w = w * 1.6;
}

// ---------- water ----------
const waterUniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
  time: { value: 0 }, sunDir: { value: new THREE.Vector3(0, 1, 0) }, deep: { value: new THREE.Color(0x174a6b) },
  shallow: { value: new THREE.Color(0x4f95a8) }, skyC: { value: new THREE.Color(0xcfdde6) }, sunC: { value: new THREE.Color(0xfff1d6) }
}]);
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms, transparent: true, fog: true, depthWrite: false,
  vertexShader: `#include <fog_pars_vertex>
    varying vec3 vW;
    void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW=w.xyz; vec4 mvPosition = viewMatrix*w; gl_Position=projectionMatrix*mvPosition;
    #include <fog_vertex>
    }`,
  fragmentShader: `#include <fog_pars_fragment>
    uniform float time; uniform vec3 sunDir, deep, shallow, skyC, sunC; varying vec3 vW;
    vec2 wave(vec2 p, vec2 d, float f, float s){ float ph=dot(p,d)*f+time*s; return d*cos(ph)*f; }
    void main(){
      vec2 p=vW.xz; vec2 g=vec2(0.0);
      g+=wave(p,normalize(vec2(1.0,0.3)),0.35,1.3)*0.06;
      g+=wave(p,normalize(vec2(-0.4,1.0)),0.6,1.9)*0.04;
      g+=wave(p,normalize(vec2(0.7,-0.8)),1.4,2.7)*0.02;
      g+=wave(p,normalize(vec2(-0.9,-0.2)),3.1,3.6)*0.012;
      vec3 n=normalize(vec3(-g.x,1.0,-g.y));
      vec3 v=normalize(cameraPosition-vW);
      float fr=pow(1.0-max(dot(n,v),0.0),3.0);
      vec3 c=mix(shallow,deep,0.55);
      c=mix(c,skyC,fr*0.65);
      vec3 h=normalize(normalize(sunDir)+v);
      c+=sunC*pow(max(dot(n,h),0.0),220.0)*1.4;
      gl_FragColor=vec4(c, mix(0.62,0.92,fr));
      #include <fog_fragment>
    }`
});

// ---------- terrain state ----------
const texLoader = new THREE.TextureLoader();
let cur = null;           // current map runtime data
let texMode = 'color';
let exag = 1;

function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

async function decodeHeight(src, range) {
  const img = await loadImage(src);
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const out = new Float32Array(c.width * c.height);
  const [lo, hi] = range;
  for (let i = 0, j = 0; i < out.length; i++, j += 4) out[i] = lo + (d[j] * 256 + d[j + 1]) / 65535 * (hi - lo);
  return { w: c.width, h: c.height, data: out };
}

function loadTex(src) {
  return new Promise(res => texLoader.load(src, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter;
    res(t);
  }));
}

// tiling grain so the ground doesn't look blurry up close
function detailTexture() {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'), img = g.createImageData(N, N);
  const base = new Float32Array(N * N);
  for (const [cells, amp] of [[8, 0.5], [16, 0.3], [32, 0.2], [64, 0.15]]) {
    const r = Array.from({ length: cells * cells }, () => Math.random());
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const fx = x / N * cells, fy = y / N * cells, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const R = (i, j) => r[((j % cells) * cells) + (i % cells)];
      const a = R(x0, y0) * (1 - sx) + R(x0 + 1, y0) * sx, b = R(x0, y0 + 1) * (1 - sx) + R(x0 + 1, y0 + 1) * sx;
      base[y * N + x] += (a * (1 - sy) + b * sy) * amp;
    }
  }
  for (let i = 0; i < N * N; i++) { const v = Math.min(255, base[i] / 1.15 * 255); img.data.set([v, v, v, 255], i * 4); }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
const detailTex = detailTexture();

// h in map units (0 = sea level) at uv (u right, v down)
function sampleH(u, v) {
  const hm = cur.hm;
  const x = Math.min(Math.max(u, 0), 1) * (hm.w - 1), y = Math.min(Math.max(v, 0), 1) * (hm.h - 1);
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(x0 + 1, hm.w - 1), y1 = Math.min(y0 + 1, hm.h - 1);
  const fx = x - x0, fy = y - y0, D = hm.data, W = hm.w;
  const a = D[y0 * W + x0] * (1 - fx) + D[y0 * W + x1] * fx;
  const b = D[y1 * W + x0] * (1 - fx) + D[y1 * W + x1] * fx;
  return a * (1 - fy) + b * fy;
}
const vScale = () => cur.def.vscale * exag;
function groundY(x, z) { return sampleH((x + cur.W / 2) / cur.W, (z + cur.D / 2) / cur.D) * vScale(); }
function uvToXZ(u, v) { return [u * cur.W - cur.W / 2, v * cur.D - cur.D / 2]; }

function applyHeights() {
  const pos = cur.geo.attributes.position, uv = cur.geo.attributes.uv, s = vScale();
  for (let i = 0; i < pos.count; i++) pos.setY(i, sampleH(uv.getX(i), 1 - uv.getY(i)) * s);
  pos.needsUpdate = true;
  cur.geo.computeVertexNormals();
  cur.geo.computeBoundingSphere();
}

async function setMap(key) {
  document.getElementById('load').style.display = 'flex';
  document.getElementById('load').style.opacity = 1;
  await new Promise(r => setTimeout(r, 30));
  if (cur) {
    scene.remove(cur.mesh); cur.geo.dispose(); cur.mesh.material.dispose();
    Object.values(cur.tex).forEach(t => t.dispose());
    if (cur.water) scene.remove(cur.water);
    if (cur.ground) scene.remove(cur.ground);
  }
  const def = MAPS[key];
  const [hm, tColor, tParch, mini] = await Promise.all([decodeHeight(def.height, def.range), loadTex(def.color), loadTex(def.parch), loadImage(def.mini)]);
  const W = def.size, D = def.size * def.aspect;
  const segX = Math.round(def.seg), segY = Math.round(def.seg * def.aspect);
  const geo = new THREE.PlaneGeometry(W, D, segX, segY);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshStandardMaterial({ map: texMode === 'color' ? tColor : tParch, roughness: 0.95, metalness: 0 });
  mat.onBeforeCompile = sh => {
    sh.uniforms.detail = { value: detailTex };
    sh.uniforms.detRep = { value: W / 5 };
    sh.fragmentShader = 'uniform sampler2D detail; uniform float detRep;\n' + sh.fragmentShader.replace('#include <map_fragment>',
      `#include <map_fragment>
      float dn = texture2D(detail, vMapUv * detRep).r * 0.55 + texture2D(detail, vMapUv * detRep * 0.21).r * 0.45;
      float fade = clamp(1.0 - length(vViewPosition) / 260.0, 0.0, 1.0);
      diffuseColor.rgb *= mix(1.0, 0.72 + 0.56 * dn, fade);`);
  };
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  cur = { key, def, hm, geo, mesh, W, D, tex: { color: tColor, parch: tParch }, mini };
  applyHeights();
  if (def.water) {
    cur.water = new THREE.Mesh(new THREE.PlaneGeometry(W * 4, D * 4), waterMat);
    cur.water.rotation.x = -Math.PI / 2; cur.water.position.y = 0;
    scene.add(cur.water);
  } else {
    cur.ground = new THREE.Mesh(new THREE.PlaneGeometry(W * 6, D * 6), new THREE.MeshStandardMaterial({ color: 0xb4ab83, roughness: 1 }));
    cur.ground.rotation.x = -Math.PI / 2; cur.ground.position.y = -1.5;
    scene.add(cur.ground);
  }
  spawnClouds(W, D);
  buildLabels();
  buildPlaces();
  setupMini();
  document.querySelectorAll('#mapSel button').forEach(b => b.classList.toggle('on', b.dataset.map === key));
  document.querySelector('#top h1').textContent = def.title;
  resetView();
  const l = document.getElementById('load'); l.style.opacity = 0; setTimeout(() => l.style.display = 'none', 600);
}

function resetView() {
  setMode('orbit');
  const [x, z] = uvToXZ(...cur.def.start);
  controls.target.set(x, groundY(x, z), z);
  camera.position.set(x, cur.W * 0.42, z + cur.D * 0.55);
  controls.update();
}

// ---------- labels ----------
const labelsEl = document.getElementById('labels');
let labels = [];
let showLabels = true;
function buildLabels() {
  labelsEl.innerHTML = '';
  labels = cur.def.labels.map(L => {
    const [x, z] = uvToXZ(L.u, L.v);
    const el = document.createElement('div');
    const sea = cur.def.water && sampleH(L.u, L.v) < 0;
    el.className = 'lbl' + (L.big ? ' big' : '') + (sea ? ' sea' : '');
    el.innerHTML = '<span></span>'; el.firstChild.textContent = L.t;
    labelsEl.appendChild(el);
    return { ...L, x, z, el, sea };
  });
}
const tmpV = new THREE.Vector3();
function updateLabels() {
  const vis = showLabels;
  for (const L of labels) {
    const y = Math.max(groundY(L.x, L.z), 0) + (L.big ? 14 : 7);
    tmpV.set(L.x, y, L.z);
    const dist = camera.position.distanceTo(tmpV);
    tmpV.project(camera);
    const far = L.big ? 2600 : 900;
    if (!vis || tmpV.z > 1 || dist > far || Math.abs(tmpV.x) > 1.1 || Math.abs(tmpV.y) > 1.1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = 'block';
    const sx = (tmpV.x * 0.5 + 0.5) * innerWidth, sy = (-tmpV.y * 0.5 + 0.5) * innerHeight;
    const near = Math.min(1, Math.max(0.55, 260 / dist + 0.5));
    L.el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-100%) scale(${near.toFixed(3)})`;
    L.el.style.left = '0'; L.el.style.top = '0';
    L.el.style.opacity = Math.min(1, (far - dist) / (far * 0.3)).toFixed(2);
    L.el.style.zIndex = String(10000 - Math.round(dist));
  }
}

function buildPlaces() {
  const box = document.getElementById('plist'); box.innerHTML = '';
  [...cur.def.labels].sort((a, b) => (b.big - a.big) || a.t.localeCompare(b.t, 'tr')).forEach(L => {
    const a = document.createElement('a'); a.textContent = (L.big ? '◆ ' : '· ') + L.t;
    a.onclick = () => goTo(L.u, L.v);
    box.appendChild(a);
  });
}

// ---------- minimap ----------
const mm = document.getElementById('mm'), mg = mm.getContext('2d');
function setupMini() {
  const w = 260; mm.width = w; mm.height = Math.round(w * cur.def.aspect);
}
function drawMini() {
  mg.drawImage(cur.mini, 0, 0, mm.width, mm.height);
  const p = mode === 'orbit' ? controls.target : camera.position;
  const u = (p.x + cur.W / 2) / cur.W, v = (p.z + cur.D / 2) / cur.D;
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const ang = Math.atan2(dir.z, dir.x);
  const x = u * mm.width, y = v * mm.height;
  mg.save(); mg.translate(x, y); mg.rotate(ang);
  mg.fillStyle = '#b8321f'; mg.strokeStyle = '#fff'; mg.lineWidth = 1.5;
  mg.beginPath(); mg.moveTo(9, 0); mg.lineTo(-6, -6); mg.lineTo(-3, 0); mg.lineTo(-6, 6); mg.closePath(); mg.fill(); mg.stroke();
  mg.restore();
}
mm.addEventListener('click', e => {
  const r = mm.getBoundingClientRect();
  goTo((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
});

// ---------- navigation ----------
let mode = 'orbit';
const player = { pos: new THREE.Vector3(), yaw: 0, pitch: -0.1, vy: 0, onGround: false };
const keys = {};
let tween = null;

function goTo(u, v) {
  const [x, z] = uvToXZ(u, v);
  const gy = Math.max(groundY(x, z), 0);
  if (mode === 'orbit') {
    const off = camera.position.clone().sub(controls.target);
    const len = Math.min(Math.max(off.length(), 60), 260);
    off.setLength(len);
    tween = { t: 0, fromT: controls.target.clone(), toT: new THREE.Vector3(x, gy, z), fromC: camera.position.clone(), toC: new THREE.Vector3(x, gy, z).add(off) };
  } else {
    player.pos.set(x, gy + (mode === 'fly' ? 40 : 2), z);
  }
}

function setMode(m) {
  if (m === mode && m !== 'orbit') return;
  const prev = mode; mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  controls.enabled = m === 'orbit';
  document.getElementById('cross').style.display = m === 'orbit' ? 'none' : 'block';
  if (m !== 'orbit' && prev === 'orbit') {
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    player.yaw = Math.atan2(-dir.x, -dir.z);
    if (m === 'walk') {
      const t = controls.target;
      player.pos.set(t.x, Math.max(groundY(t.x, t.z), 0) + 2.4, t.z);
      player.pitch = -0.05;
    } else {
      player.pos.copy(camera.position);
      player.pitch = Math.asin(Math.max(-1, Math.min(1, dir.y)));
    }
  }
  if (m === 'orbit' && prev !== 'orbit') {
    if (document.pointerLockElement) document.exitPointerLock();
    const dir = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const p = player.pos.clone().addScaledVector(dir, 40);
    controls.target.set(p.x, Math.max(groundY(p.x, p.z), 0), p.z);
    camera.position.copy(player.pos).add(new THREE.Vector3(0, 25, 0)).addScaledVector(dir, -30);
    controls.update();
  }
  updateHelp();
}

function updateHelp() {
  const h = {
    orbit: 'Sürükle: döndür · Sağ tık / iki parmak: kaydır · Tekerlek: yakınlaş · <b>W A S D</b>: gez',
    fly: 'Tıkla: fareyi kilitle (Esc bırakır) · <b>W A S D</b>: uç · <b>Boşluk</b>/<b>C</b>: yüksel/alçal · <b>Shift</b>: hızlı',
    walk: 'Tıkla: fareyi kilitle (Esc bırakır) · <b>W A S D</b>: yürü · <b>Shift</b>: koş · <b>Boşluk</b>: zıpla · denizde yüzersin'
  }[mode];
  document.getElementById('help').innerHTML = h + '<br><b>R</b>: başa dön · <b>L</b>: yer adları';
}

// mouse look (pointer lock, with drag fallback)
let dragging = false;
canvas.addEventListener('mousedown', e => {
  canvas.focus();
  if (mode === 'orbit') return;
  dragging = true;
  if (!document.pointerLockElement && canvas.requestPointerLock) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
});
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => {
  if (mode === 'orbit') return;
  if (!(document.pointerLockElement === canvas || dragging)) return;
  player.yaw -= e.movementX * 0.0022;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - e.movementY * 0.0022));
});
// touch look for phones
let lastTouch = null;
canvas.addEventListener('touchstart', e => { if (mode !== 'orbit' && e.touches.length === 1) lastTouch = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (mode === 'orbit' || !lastTouch) return;
  const t = e.touches[0];
  player.yaw -= (t.clientX - lastTouch[0]) * 0.004;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - (t.clientY - lastTouch[1]) * 0.004));
  lastTouch = [t.clientX, t.clientY];
  if (e.touches.length > 1) keys.KeyW = true;
}, { passive: true });
canvas.addEventListener('touchend', () => { lastTouch = null; keys.KeyW = false; });

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (e.code === 'Digit1') setMode('orbit');
  if (e.code === 'Digit2') setMode('fly');
  if (e.code === 'Digit3') setMode('walk');
  if (e.code === 'KeyR') resetView();
  if (e.code === 'KeyL') toggleLabels();
  if (e.code === 'Space' && mode === 'walk' && player.onGround) { player.vy = 10; player.onGround = false; }
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function moveInput() {
  let f = 0, r = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) r += 1;
  if (keys.KeyA || keys.ArrowLeft) r -= 1;
  return [f, r];
}

function updateNav(dt) {
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.3);
    const k = tween.t < 0.5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;
    controls.target.lerpVectors(tween.fromT, tween.toT, k);
    camera.position.lerpVectors(tween.fromC, tween.toC, k);
    if (tween.t >= 1) tween = null;
  }
  const [f, r] = moveInput();
  if (mode === 'orbit') {
    if (f || r) {
      const dist = camera.position.distanceTo(controls.target);
      const sp = dist * 0.9 * dt * (keys.ShiftLeft || keys.ShiftRight ? 3 : 1);
      const fw = new THREE.Vector3(); camera.getWorldDirection(fw); fw.y = 0; fw.normalize();
      const rt = new THREE.Vector3(-fw.z, 0, fw.x);
      const d = fw.multiplyScalar(f * sp).addScaledVector(rt, r * sp);
      controls.target.add(d); camera.position.add(d);
      controls.target.y = Math.max(groundY(controls.target.x, controls.target.z), 0);
    }
    controls.update();
    const minY = Math.max(groundY(camera.position.x, camera.position.z), 0) + 2;
    if (camera.position.y < minY) camera.position.y = minY;
    return;
  }
  const fast = keys.ShiftLeft || keys.ShiftRight;
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  if (mode === 'fly') {
    const look = new THREE.Vector3(fwd.x * Math.cos(player.pitch), Math.sin(player.pitch), fwd.z * Math.cos(player.pitch));
    const sp = (fast ? 180 : 45) * dt;
    player.pos.addScaledVector(look, f * sp).addScaledVector(right, r * sp);
    if (keys.Space) player.pos.y += sp;
    if (keys.KeyC || keys.ControlLeft) player.pos.y -= sp;
    const minY = Math.max(groundY(player.pos.x, player.pos.z), 0) + 1.5;
    player.pos.y = Math.max(minY, Math.min(player.pos.y, 900));
  } else {
    const gy = groundY(player.pos.x, player.pos.z);
    const swimming = cur.def.water && gy < -0.6;
    const sp = (swimming ? 5 : fast ? 30 : 10) * dt;
    const mv = fwd.clone().multiplyScalar(f).addScaledVector(right, r);
    if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(sp);
    // slope limit: don't climb near-vertical cliffs
    const nx = player.pos.x + mv.x, nz = player.pos.z + mv.z;
    const ng = groundY(nx, nz);
    if (ng - gy < sp * 2.2 || swimming) { player.pos.x = nx; player.pos.z = nz; }
    const eye = 2.4;
    const g2 = groundY(player.pos.x, player.pos.z);
    if (cur.def.water && g2 < -0.6) {
      player.pos.y += (0.9 - player.pos.y) * Math.min(1, dt * 6); player.vy = 0; player.onGround = true;
    } else {
      player.vy -= 20 * dt; player.pos.y += player.vy * dt;
      if (player.pos.y <= g2 + eye) { player.pos.y = g2 + eye; player.vy = 0; player.onGround = true; }
    }
    // keep inside the map
    player.pos.x = Math.max(-cur.W / 2, Math.min(cur.W / 2, player.pos.x));
    player.pos.z = Math.max(-cur.D / 2, Math.min(cur.D / 2, player.pos.z));
  }
  camera.position.copy(player.pos);
  const look = new THREE.Vector3(fwd.x * Math.cos(player.pitch), Math.sin(player.pitch), fwd.z * Math.cos(player.pitch));
  camera.lookAt(player.pos.clone().add(look));
}

// ---------- sun / time of day ----------
function setSun(t) {
  // t: 0 = morning, 0.5 = noon, 1 = evening
  const a = 0.15 + t * (Math.PI - 0.3);
  const el = Math.sin(a) * 0.95 + 0.05;
  const dir = new THREE.Vector3(Math.cos(a), el * 1.1, -0.45).normalize();
  sun.position.copy(dir).multiplyScalar(1000);
  const warm = 1 - Math.min(1, el * 1.6);
  sun.color.setHSL(0.09, 0.6 + warm * 0.3, 0.92 - warm * 0.2);
  sun.intensity = 1.2 + el * 1.3;
  const horizon = new THREE.Color().setHSL(0.56 - warm * 0.5, 0.35 + warm * 0.3, 0.84 - warm * 0.08);
  const top = new THREE.Color().setHSL(0.58, 0.55, 0.55 + el * 0.08);
  skyUniforms.top.value.copy(top); skyUniforms.horizon.value.copy(horizon);
  skyUniforms.sunDir.value.copy(dir); skyUniforms.sunCol.value.copy(sun.color);
  scene.fog.color.copy(horizon);
  waterUniforms.sunDir.value.copy(dir); waterUniforms.skyC.value.copy(horizon); waterUniforms.sunC.value.copy(sun.color);
  hemi.intensity = 0.6 + el * 0.5;
}

// ---------- UI ----------
const mapSel = document.getElementById('mapSel');
Object.entries(MAPS).forEach(([k, d]) => {
  const b = document.createElement('button'); b.className = 't'; b.dataset.map = k; b.textContent = d.title;
  b.onclick = () => { if (!cur || cur.key !== k) setMap(k); };
  mapSel.appendChild(b);
});
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-tex]').forEach(b => b.onclick = () => {
  texMode = b.dataset.tex;
  document.querySelectorAll('[data-tex]').forEach(x => x.classList.toggle('on', x === b));
  cur.mesh.material.map = cur.tex[texMode]; cur.mesh.material.needsUpdate = true;
});
function toggleLabels() { showLabels = !showLabels; document.getElementById('lblBtn').classList.toggle('on', showLabels); }
document.getElementById('lblBtn').onclick = toggleLabels;
let exagTimer = null;
document.getElementById('exag').addEventListener('input', e => {
  exag = +e.target.value;
  clearTimeout(exagTimer); exagTimer = setTimeout(applyHeights, 40);
});
document.getElementById('sun').addEventListener('input', e => setSun(+e.target.value));
document.getElementById('collapse').onclick = () => {
  const t = document.getElementById('top'); t.classList.toggle('min');
  document.getElementById('collapse').textContent = t.classList.contains('min') ? '+' : '–';
};
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

setSun(0.35);
updateHelp();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (cur) {
    updateNav(dt);
    waterUniforms.time.value += dt;
    sky.position.copy(camera.position);
    const cw = clouds.userData.w || 1;
    for (const c of clouds.children) { c.position.x += c.userData.v * dt; if (c.position.x > cw / 2) c.position.x -= cw; }
    updateLabels();
    drawMini();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
setMap(Object.keys(MAPS)[0]).then(frame);
</script>
</body>
