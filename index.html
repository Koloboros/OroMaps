<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oro Külliyatı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --wine:#3a1418; --wine-2:#4d1c21; --blood:#9a2828; --ember:#c2483a;
  --paper:#efe2c4; --paper-2:#e2d0a8; --ink:#2a1a10; --muted:#7a6248;
  --line:rgba(239,226,196,.18); --panel:rgba(38,13,16,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b0b0d;color:var(--paper);font-family:'Crimson Pro',Georgia,serif}
#map{position:fixed;inset:0;background:#d9c69c}
.leaflet-container{font-family:inherit;background:#d9c69c}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--paper)!important;border-color:var(--line)!important}

/* brand */
#brand{position:fixed;top:14px;left:14px;z-index:500;width:min(330px,calc(100vw - 28px));background:var(--panel);border:1px solid rgba(154,40,40,.7);border-radius:8px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#brand h1{font-family:'Libre Baskerville',serif;font-size:19px;letter-spacing:.14em;text-transform:uppercase;margin:0}
#brand .sub{font-size:15px;color:#cdb991;margin:2px 0 10px;font-style:italic}
#crumb{display:none;margin:0 0 10px}
#crumb button{all:unset;cursor:pointer;color:#f0c9a0;font-size:15px;border-bottom:1px solid rgba(240,201,160,.4)}
#search{width:100%;font:inherit;font-size:16px;padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:rgba(239,226,196,.07);color:var(--paper);outline:none}
#search::placeholder{color:#a8916c}
#search:focus{border-color:var(--ember)}
#results{margin-top:6px;max-height:40vh;overflow:auto}
#results a{display:block;padding:6px 8px;border-radius:4px;color:var(--paper);text-decoration:none;cursor:pointer;line-height:1.25}
#results a:hover{background:rgba(154,40,40,.35)}
#results small{display:block;color:#bfa77f;font-size:13px}
#brand .links{display:flex;gap:14px;margin-top:10px;font-size:14px}
#brand .links a{color:#cdb991;text-decoration:none;border-bottom:1px dotted rgba(205,185,145,.5)}

/* codex panel */
#codex{position:fixed;top:14px;right:14px;bottom:14px;z-index:500;width:min(400px,calc(100vw - 28px));background:var(--panel);border:1px solid rgba(154,40,40,.7);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;transition:transform .35s ease}
#codex header{padding:18px 20px 12px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(rgba(154,40,40,.18),transparent)}
#codex .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#d8a07a}
#codex h2{font-family:'Libre Baskerville',serif;font-size:24px;margin:4px 0 6px;line-height:1.2}
#codex .desc{font-size:16.5px;line-height:1.45;color:#e3d2ae;margin:0}
#codex .pin{position:absolute;top:14px;right:14px;all:unset;cursor:pointer;color:#cdb991;font-size:20px;line-height:1;padding:4px 8px;position:absolute}
#codex .body{overflow:auto;padding:6px 14px 18px;flex:1}
.grp{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#d8a07a;margin:16px 6px 6px}
.post{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 8px;border-radius:6px;color:var(--paper);text-decoration:none;border:1px solid transparent;transition:background .15s,border-color .15s}
.post:hover{background:rgba(239,226,196,.06);border-color:rgba(154,40,40,.6)}
.post .thumb{width:64px;height:64px;border-radius:4px;object-fit:cover;background:#2a0f12;border:1px solid var(--line)}
.post .mono{display:flex;align-items:center;justify-content:center;font-family:'Libre Baskerville',serif;font-size:24px;color:#d8a07a}
.post h3{font-family:'Libre Baskerville',serif;font-size:15.5px;margin:0 0 3px;line-height:1.3}
.post .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.post .chip{font-size:12px;padding:0 6px;border-radius:3px;background:rgba(154,40,40,.35);color:#f3d9c0}
.post p{margin:0;font-size:15px;line-height:1.35;color:#d4c19c;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.enter{display:block;margin:12px 6px 4px;border-radius:6px;overflow:hidden;border:1px solid rgba(154,40,40,.8);cursor:pointer;position:relative;text-decoration:none;color:var(--paper)}
.enter img{display:block;width:100%;height:150px;object-fit:cover;filter:sepia(.3) brightness(.85)}
.enter span{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(30,8,10,.92));font-family:'Libre Baskerville',serif;font-size:15px;letter-spacing:.06em}
.idx{display:flex;justify-content:space-between;align-items:baseline;padding:9px 8px;border-radius:5px;cursor:pointer;color:var(--paper);text-decoration:none;border-bottom:1px solid rgba(239,226,196,.07)}
.idx:hover{background:rgba(154,40,40,.3)}
.idx b{font-family:'Libre Baskerville',serif;font-weight:400;font-size:16px}
.idx em{font-style:normal;color:#d8a07a;font-size:14px}
.idx small{display:block;color:#b59d77;font-size:13.5px;font-style:italic}
.hint{font-size:15px;color:#bfa77f;font-style:italic;margin:14px 8px}

/* map marks */
/* medallion: parchment disc, double wine ring, ink icon. Opacity is driven by cursor proximity. */
.seal{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 35%,#f6ecd4,#e3cfa3 75%);
  box-shadow:0 0 0 1.5px #7a1c1c,0 0 0 4px rgba(246,236,212,.9),0 0 0 5px rgba(122,28,28,.55),0 6px 16px rgba(40,10,10,.35);
  opacity:0;transform:scale(.82);transition:opacity .35s ease,transform .35s ease;cursor:pointer;will-change:opacity,transform}
.seal svg{width:26px;height:26px;fill:none;stroke:#5a1616;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.seal.on{opacity:1!important;transform:scale(1.08)!important}
.touch .seal{opacity:.92;transform:scale(.9)}
/* book */
.book{display:grid;grid-template-columns:86px 1fr;gap:14px;margin:8px 6px 4px;padding:12px;border-radius:8px;border:1px solid rgba(154,40,40,.75);background:linear-gradient(135deg,rgba(154,40,40,.22),rgba(154,40,40,.05))}
.book img{width:86px;height:118px;object-fit:cover;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.book h3{font-family:'Libre Baskerville',serif;font-size:17px;margin:0 0 2px;letter-spacing:.03em}
.book .by{font-size:14px;color:#cdb991;margin-bottom:6px}
.book q{display:block;font-style:italic;font-size:15px;line-height:1.35;color:#e3d2ae;margin-bottom:10px}
.buy{display:inline-block;padding:7px 16px;border-radius:4px;background:#9a2828;color:#fdf3e2;text-decoration:none;font-family:'Libre Baskerville',serif;font-size:13.5px;letter-spacing:.08em;border:1px solid #c2483a;transition:background .2s}
.buy:hover{background:#b23131}
.soon{margin:10px 6px;padding:10px 12px;border:1px dashed rgba(239,226,196,.25);border-radius:8px;color:#bfa77f;font-style:italic;font-size:15px}
.rlabel{background:rgba(38,13,16,.88)!important;color:var(--paper)!important;border:1px solid rgba(154,40,40,.8)!important;border-radius:4px!important;font-family:'Libre Baskerville',serif;font-size:13px;letter-spacing:.05em;padding:3px 8px!important;box-shadow:none!important}
.rlabel::before{display:none}
.pulse{animation:pulse 1.4s ease 2}
@keyframes pulse{50%{fill-opacity:.45}}

@media (max-width:760px){
  #brand{padding:10px 12px}
  #brand .sub{display:none}
  #codex{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:46vh}
  #codex.min{transform:translateY(calc(100% - 86px))}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="brand">
  <h1 id="title">Oro Külliyatı</h1>
  <div class="sub">Bir diyarın üstüne gel; orada yazılmış olanlar belirsin.</div>
  <div id="crumb"><button id="back">← Oro Kıtaları'na dön</button></div>
  <input id="search" type="search" placeholder="Yazı ya da diyar ara…" autocomplete="off">
  <div id="results"></div>
  <div class="links"><a href="https://koloboros.com">Koloboros'a dön</a><a href="3b/">3B görünüm (deneysel)</a></div>
</div>

<aside id="codex"><header></header><div class="body"></div></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
const D = window.ORO, P = D.posts;
const map = L.map('map', { crs: L.CRS.Simple, zoomSnap: 0.25, zoomDelta: 0.5, attributionControl: false, zoomControl: false, maxBoundsViscosity: 0.8 });
L.control.zoom({ position: 'bottomleft' }).addTo(map);
window.oroMap = map;
const codex = document.getElementById('codex'), head = codex.querySelector('header'), body = codex.querySelector('.body');
let cur = null, layers = [], pinned = null, regionLayers = {};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const countOf = r => new Set(r.groups.flatMap(g => g[1])).size;
const STYLE = { color: '#7a1c1c', weight: 1, dashArray: null, fillColor: '#8a1f1f', fillOpacity: 0.10, opacity: 0.25, bubblingMouseEvents: false };
const HOVER = { weight: 1.8, dashArray: null, fillOpacity: 0.2, opacity: 0.85, color: '#7a1c1c' };

// hand-drawn style icons, 24x24, stroked in ink
const ICONS = {
  ceremo: '<path d="M4 20h16M6 20v-3h12v3M8 17v-3h8v3M10 14v-3h4v3"/><circle cx="12" cy="6.4" r="1.9"/><path d="M12 2.6v.9M8.6 4.1l.6.6M15.4 4.1l-.6.6M7.3 7.2h.9M15.8 7.2h.9"/>',
  surtunkaya: '<path d="M3 19.5c1.8 0 2-1.4 3.8-1.4s2 1.4 3.8 1.4 2-1.4 3.8-1.4 2 1.4 3.8 1.4 1.4-.6 1.8-.9"/><path d="M4.5 16.2 8 8.5l2.6 2.2 2.2-5.2 3.3 4.6 3.4 6.1"/><path d="M9.5 13.5l1.3 1.1M13.7 11.5l.9 1.4"/>',
  derman: '<path d="M3 20.5V10h2.6v2.2h2.1V10h2.6v2.2h2.4V10h2.6v2.2h2.1V10H21v10.5z"/><path d="M10 20.5v-3.6a2 2 0 0 1 4 0v3.6"/><path d="M12 9.6V4.2l3 1.2-3 1.2"/>',
  kavurova: '<path d="M2.5 19.5c2.7-2.4 5.4-2.4 8.1 0s5.4 2.4 8.1 0c.9-.8 1.9-1.2 2.8-1.2"/><path d="M6.4 16.3c-.3-4.6 1.7-8.5 5.3-8.9 3.1-.3 4.9 2 4.5 4.3-.4 2.2-2.7 3-4.2 2.1-1.1-.7-1-2.3.1-2.6"/><path d="M15.6 9.1l1.6-1.3M16.3 10.3l2-.4"/>',
  payendegan: '<path d="M4.5 6.2 12 2.8l7.5 3.4z"/><path d="M5.5 7.8h13M6.5 9.4h11M8.4 9.4v8.4M12 9.4v8.4M15.6 9.4v8.4M6.5 17.8h11M5 19.7h14"/>',
  haarbova: '<path d="M3 20.5h18"/><path d="M5.2 20.5v-9.8l1.9-2.1 1.9 2.1v9.8M10.3 20.5V6.3L12 4.1l1.7 2.2v14.2M15 20.5v-8.2l1.9-1.9 1.9 1.9v8.2"/><path d="M12 9.3v3.4M10.9 11h2.2M7.1 13.4v2M16.9 14.6l.01.01"/>',
  vefat: '<path d="M2.5 20.5 9 8.8l2.9 3.9L15 6.5l6.5 14z"/><path d="M13.6 9.7l.9 1.5"/><ellipse cx="12.2" cy="17.6" rx="1.5" ry="2.5"/><path d="M9.8 16.4l-.9-.5M14.6 16.4l.9-.5M12.2 14.2v-.8"/>',
  pofova: '<path d="M18.5 3C11 5.2 6.6 11.4 6.2 21"/><path d="M18.5 3c.9 6.6-3.2 11.6-10 12.6"/><path d="M10.9 8.7l2.8.6M9.3 11.4l3 .9M8.1 14.4l2.9 1M15.2 5.4l2.2-.2"/>',
  sumukeli: '<path d="M2.5 19.2c1.6-1 3.2-1 4.8 0s3.2 1 4.8 0 3.2-1 4.8 0 2.4.6 3.6.3"/><path d="M6.5 17.2V8.6M6.5 8.6c-1-1-1.1-3 0-4.2 1.1 1.2 1 3.2 0 4.2M10.4 16.6V6.3M10.4 6.3c-.9-1-1-2.9 0-4 1 1.1.9 3 0 4M14.2 17.3v-6.1"/><path d="M13.1 13.6l7.2-5.4M19.4 7.1l1.8 2.3"/>',
  'h-ucmakan': '<path d="M12 21.3V4.4"/><circle cx="12" cy="3.2" r="1.1"/><path d="M12 6.1c-2.9.9-4 3.8-3 8.3M12 6.1c2.9.9 4 3.8 3 8.3M12 7.2c-1.4 2.1-1.4 5 0 7.6M9.6 18.6h4.8"/>',
  'h-tirsnadoruk': '<path d="M3 4.5h18L12 20.5z"/><path d="M6.6 8.6h10.8"/><circle cx="8.6" cy="6.5" r=".45"/><circle cx="10.3" cy="6.5" r=".45"/><circle cx="12" cy="6.5" r=".45"/><circle cx="13.7" cy="6.5" r=".45"/><circle cx="15.4" cy="6.5" r=".45"/><circle cx="10.9" cy="11.2" r=".45"/><circle cx="13.1" cy="11.2" r=".45"/>',
  'h-kufkent': '<ellipse cx="12" cy="13.2" rx="2.6" ry="3.1"/><circle cx="12" cy="8.6" r="1.6"/><path d="M9.6 11.6 5.5 8.3 4.2 9.5M9.4 13.3 4.4 13l-.9 1.6M9.8 15.1l-3.6 3.4.4 1.6M14.4 11.6l4.1-3.3 1.3 1.2M14.6 13.3l5-.3.9 1.6M14.2 15.1l3.6 3.4-.4 1.6"/><path d="M12 6.9V3"/>',
  'h-gecekoynu': '<path d="M14.6 3.6a8.6 8.6 0 1 0 5.8 13.6A7 7 0 0 1 14.6 3.6z"/><path d="M18.6 6.1 11.2 17.8M10.2 16l2.8 1.8M10.7 18.6l-.9 1.5"/>',
};
const iconFor = id => `<div class="seal"><svg viewBox="0 0 24 24">${ICONS[id] || ICONS.ceremo}</svg></div>`;

const BOOKS = [{
  t: 'Nebrukaddesar', by: 'T. Can Koloğlugil (Koloboros)', region: 'ceremo',
  img: 'https://koloboros.wordpress.com/wp-content/uploads/2025/09/gemini_generated_image_4q693h4q693h4q69.jpeg?w=300',
  q: 'Okurken kimin konuştuğuna dikkat et, Alemgezer. Kimin sustuğuna daha çok.',
  qby: 'İsimur, Haşmetli Ceremo’nun Vakanivüs’i',
  buy: 'https://ejderhakitap.com/nebrukaddesar-t-can-kologlugil-koloboros?kapak-secimi=ciltsiz-normak-kapak',
}];
function bookHTML(b) {
  return `<div class="book"><img src="${esc(b.img)}" alt="Nebrukaddesar kapağı" loading="lazy"><div><div class="kicker" style="font-size:12px">Kitap</div><h3>${esc(b.t)}</h3><div class="by">${esc(b.by)}</div><q>${esc(b.q)}</q><div class="by" style="margin:-6px 0 10px;font-size:13px">— ${esc(b.qby)}</div><a class="buy" href="${esc(b.buy)}" target="_blank" rel="noopener">Satın Al</a></div></div>`;
}

function toLL(p) { return map.unproject(p, cur.maxz); }

function showMap(key, focus) {
  layers.forEach(l => map.removeLayer(l)); layers = []; regionLayers = {}; pinned = null;
  cur = D.maps[key]; cur.key = key;
  const bounds = L.latLngBounds(toLL([0, cur.h]), toLL([cur.w, 0]));
  layers.push(L.tileLayer(`tiles/${key}/{z}/{x}/{y}.jpg`, { bounds, noWrap: true, maxNativeZoom: cur.maxz, minNativeZoom: cur.minz, maxZoom: cur.maxz + 1, minZoom: 0 }).addTo(map));
  map.setMaxZoom(cur.maxz + 1);
  map.setMaxBounds(bounds.pad(0.6));
  const fit = map.getBoundsZoom(bounds, false);
  map.setMinZoom(fit - 0.5);
  map.fitBounds(bounds, { animate: false, paddingTopLeft: [innerWidth > 760 ? 40 : 0, 0], paddingBottomRight: [innerWidth > 760 ? 420 : 0, innerWidth > 760 ? 0 : innerHeight * 0.35] });

  cur.regions.forEach(r => {
    const shape = r.poly
      ? L.polygon(r.poly.map(ring => ring.map(toLL)), STYLE)
      : L.circle(toLL(r.c), { ...STYLE, radius: r.r / Math.pow(2, cur.maxz) });
    shape.addTo(map); layers.push(shape);
    const c = r.poly ? centroid(r) : toLL(r.c);
    const seal = L.marker(c, { icon: L.divIcon({ className: '', html: iconFor(r.id), iconSize: [44, 44] }), keyboard: false }).addTo(map);
    seal.bindTooltip(`${esc(r.n)} · ${countOf(r)} yazı`, { className: 'rlabel', direction: 'top', offset: [0, -24] });
    layers.push(seal);
    regionLayers[r.id] = { shape, seal, r };
    const enter = () => { hover(r.id, true); if (!pinned) renderRegion(r); };
    const leave = () => { hover(r.id, false); };
    const click = () => { if (r.map) { showMap(r.map); return; } pin(r.id); };
    [shape, seal].forEach(l => l.on({ mouseover: enter, mouseout: leave, click }));
  });
  document.getElementById('title').textContent = key === 'oro' ? 'Oro Külliyatı' : cur.title;
  document.getElementById('crumb').style.display = key === 'oro' ? 'none' : 'block';
  if (focus) pin(focus); else renderIndex();
}

function centroid(r) {
  // centre of the largest ring, nudged to a point inside it
  const ring = r.poly.reduce((a, b) => (b.length > a.length ? b : a));
  const poly = L.polygon(ring.map(toLL));
  let c = poly.getBounds().getCenter();
  const pts = ring.map(toLL);
  if (!inside(c, pts)) { let best = pts[0], bd = 1e9; pts.forEach(p => { const d = p.distanceTo(c); if (d < bd) { bd = d; best = p; } }); c = L.latLng((best.lat + c.lat) / 2, (best.lng + c.lng) / 2); }
  return c;
}
function inside(p, pts) { let r = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if (((a.lat > p.lat) !== (b.lat > p.lat)) && (p.lng < (b.lng - a.lng) * (p.lat - a.lat) / (b.lat - a.lat) + a.lng)) r = !r; } return r; }

function hover(id, on) {
  const L_ = regionLayers[id]; if (!L_) return;
  if (on || pinned === id) L_.shape.setStyle(HOVER); else L_.shape.setStyle(STYLE);
  L_.seal.getElement()?.firstChild.classList.toggle('on', on || pinned === id);
}

function pin(id) {
  const prev = pinned; pinned = id;
  if (prev && prev !== id) hover(prev, false);
  hover(id, true);
  const r = regionLayers[id].r;
  renderRegion(r);
  map.flyToBounds(regionLayers[id].shape.getBounds(), { maxZoom: cur.maxz - 2.5, duration: 0.8, paddingBottomRight: [innerWidth > 760 ? 420 : 0, innerWidth > 760 ? 0 : innerHeight * 0.45] });
  codex.classList.remove('min');
}

function postHTML(id) {
  const p = P[id]; if (!p) return '';
  const img = p.i ? `<img class="thumb" src="${esc(p.i)}" alt="" loading="lazy">` : `<div class="thumb mono">${esc(p.t[0])}</div>`;
  const chips = p.c.slice(0, 2).map(c => `<span class="chip">${esc(c)}</span>`).join('');
  return `<a class="post" href="${esc(p.u)}" target="_blank" rel="noopener">${img}<div><h3>${esc(p.t)}</h3><div class="chips">${chips}</div><p>${esc(p.x)}</p></div></a>`;
}

function renderRegion(r) {
  const n = countOf(r);
  head.innerHTML = `<div class="kicker">${esc(r.s || '')}</div><h2>${esc(r.n)}</h2><p class="desc">${esc(r.d || '')}</p>` +
    (pinned ? `<button class="pin" title="Kapat" onclick="unpin()">×</button>` : '');
  let h = '';
  if (r.map) h += `<a class="enter" onclick="showMap('${r.map}')"><img src="3b/haarbova-mini.jpg" alt=""><span>${esc(D.maps[r.map].title)} haritasına gir →</span></a>`;
  const books = BOOKS.filter(b => b.region === r.id);
  if (books.length) h += `<div class="grp">Kitap</div>` + books.map(bookHTML).join('');
  h += `<div class="grp">${n} yazı</div>`;
  r.groups.forEach(([g, ids]) => { if (g) h += `<div class="grp">${esc(g)}</div>`; h += ids.map(postHTML).join(''); });
  body.innerHTML = h; body.scrollTop = 0;
}

function unpin() { const p = pinned; pinned = null; if (p) hover(p, false); renderIndex(); }

function renderIndex() {
  const total = cur.key === 'oro' ? Object.keys(P).length : new Set(cur.regions.flatMap(r => r.groups.flatMap(g => g[1]))).size;
  head.innerHTML = `<div class="kicker">${cur.key === 'oro' ? 'Külliyat' : 'Bölge haritası'}</div><h2>${esc(cur.title)}</h2>` +
    `<p class="desc">${cur.key === 'oro' ? `${total} yazı, ${cur.regions.length} diyara dağılmış. Bir diyarın üstüne gel ya da aşağıdan seç.` : `Holminn Hayrabolu'nun rüyalarından çizilen diyar. ${cur.regions.length} yer, ${total} yazı.`}</p>`;
  body.innerHTML = `<div class="grp">Diyarlar</div>` + cur.regions.map(r =>
    `<a class="idx" data-id="${r.id}"><span><b>${esc(r.n)}</b><small>${esc(r.s || '')}</small></span><em>${countOf(r)} yazı</em></a>`).join('') +
    (cur.key === 'oro' ? `<div class="grp">Kitaplar</div>` + BOOKS.map(bookHTML).join('') + `<div class="soon">Ren &amp; Dhundar yakında haritaya eklenecek.</div>` : '');
  body.querySelectorAll('.idx').forEach(a => {
    const id = a.dataset.id;
    a.onmouseenter = () => hover(id, true); a.onmouseleave = () => hover(id, false);
    a.onclick = () => { const r = regionLayers[id].r; if (r.map) showMap(r.map); else pin(id); };
  });
}

// search: posts and regions across both maps
const search = document.getElementById('search'), results = document.getElementById('results');
const norm = s => s.toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '');
function whereIs(pid) { const out = []; for (const [k, m] of Object.entries(D.maps)) m.regions.forEach(r => { if (r.groups.some(g => g[1].includes(+pid))) out.push([k, r]); }); return out; }
search.addEventListener('input', () => {
  const q = norm(search.value.trim());
  if (!q) { results.innerHTML = ''; return; }
  const hits = [];
  for (const [k, m] of Object.entries(D.maps)) m.regions.forEach(r => { if (norm(r.n).includes(q)) hits.push({ label: r.n, sub: 'Diyar · ' + m.title, go: () => goRegion(k, r.id) }); });
  Object.entries(P).forEach(([id, p]) => { if (norm(p.t).includes(q) || norm(p.x).includes(q)) { const w = whereIs(id); if (w.length) hits.push({ label: p.t, sub: w.map(([, r]) => r.n).join(' · '), go: () => goRegion(w[0][0], w[0][1].id) }); } });
  results.innerHTML = hits.slice(0, 12).map((h, i) => `<a data-i="${i}">${esc(h.label)}<small>${esc(h.sub)}</small></a>`).join('') || '<small style="padding:6px 8px;display:block;color:#bfa77f">Bulunamadı</small>';
  results.querySelectorAll('a').forEach(a => a.onclick = () => { hits[+a.dataset.i].go(); results.innerHTML = ''; search.value = ''; });
});
function goRegion(mapKey, id) { if (cur.key !== mapKey) showMap(mapKey, id); else pin(id); regionLayers[id]?.shape._path?.classList.add('pulse'); }

document.getElementById('back').onclick = () => showMap('oro', 'haarbova');
codex.querySelector('header').addEventListener('click', e => { if (innerWidth <= 760 && e.target.tagName !== 'BUTTON') codex.classList.toggle('min'); });
map.on('click', e => { if (pinned && !e.originalEvent._regionHit) unpin(); });
addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });

// medallions fade in as the cursor approaches; touch screens show them all
const isTouch = matchMedia('(hover: none)').matches;
if (isTouch) document.body.classList.add('touch');
let lastPt = null;
function proximity() {
  if (isTouch) return;
  Object.values(regionLayers).forEach(({ seal }) => {
    const el = seal.getElement()?.firstChild; if (!el) return;
    if (!lastPt) { el.style.opacity = ''; el.style.transform = ''; return; }
    const p = map.latLngToContainerPoint(seal.getLatLng());
    const d = Math.hypot(p.x - lastPt.x, p.y - lastPt.y);
    const k = Math.max(0, Math.min(1, 1 - (d - 50) / 170));
    el.style.opacity = k.toFixed(2);
    el.style.transform = `scale(${(0.82 + 0.18 * k).toFixed(3)})`;
  });
}
map.on('mousemove', e => { lastPt = e.containerPoint; proximity(); });
map.on('mouseout', () => { lastPt = null; proximity(); });
map.on('zoomend moveend', proximity);

if (innerWidth <= 760) codex.classList.add('min');
showMap('oro');
</script>
</body>
