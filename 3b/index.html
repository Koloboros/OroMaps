<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oro Kıtaları 3B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(38,13,16,.92);--paper:#efe2c4;--line:rgba(239,226,196,.18);--blood:#9a2828}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfdde6;font-family:'Crimson Pro',Georgia,serif;color:var(--paper)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.panel{position:fixed;background:var(--panel);border:1px solid rgba(154,40,40,.7);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#top{top:14px;left:14px;padding:12px 14px;width:min(320px,calc(100vw - 28px))}
#top h1{font-family:'Libre Baskerville',serif;font-size:17px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:7px 0}
button.t{font:inherit;font-size:14.5px;padding:3px 10px;border-radius:4px;border:1px solid var(--line);background:rgba(239,226,196,.06);color:var(--paper);cursor:pointer}
button.t.on{background:var(--blood);border-color:#c2483a}
label{font-size:15px}
input[type=range]{width:120px;accent-color:#c2483a;vertical-align:middle}
.k{font-size:14px;line-height:1.4;color:#d4c19c}
.k b{font-family:'Libre Baskerville',serif;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--paper);font-weight:400}
#top a{color:#cdb991;font-size:14.5px;text-decoration:none;border-bottom:1px dotted rgba(205,185,145,.5)}
#collapse{position:absolute;top:8px;right:8px;padding:0 8px}
#top.min .body{display:none}
#mini{right:14px;bottom:14px;padding:6px}
#mini canvas{display:block;border-radius:4px;cursor:crosshair;width:min(240px,38vw);height:auto}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;text-align:center;color:#2b1a10;text-shadow:0 0 3px rgba(250,242,222,.95),0 0 8px rgba(250,242,222,.7)}
.lbl.region{font-family:'Libre Baskerville',serif;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#4a1a14}
.lbl.sea{font-family:'Libre Baskerville',serif;font-style:italic;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#1d4a5c;text-shadow:0 0 6px rgba(220,240,248,.8)}
.lbl.lake{font-style:italic;font-size:14px;color:#1d4a5c;text-shadow:0 0 6px rgba(220,240,248,.8)}
.lbl.city{font-family:'Libre Baskerville',serif;font-size:14.5px;font-weight:700}
.lbl.city::before{content:'◉ ';color:#7a1c1c}
.lbl.town{font-size:14px}
.lbl.town::before{content:'• ';color:#7a1c1c}
.lbl.mountain{font-size:13.5px;font-style:italic;color:#3a2a20}
.lbl.mountain::before{content:'▲ ';font-size:10px;color:#5a4636;font-style:normal}
.lbl.forest{font-size:13.5px;font-style:italic;color:#24401c}
.lbl.island{font-size:13px;font-style:italic;color:#2c4a50}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#2a0f12;z-index:10;font-family:'Libre Baskerville',serif;letter-spacing:.15em;transition:opacity .6s}
#load small{font-family:'Crimson Pro',serif;letter-spacing:0;color:#cdb991;font-size:16px}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 3px #000;display:none;pointer-events:none}
@media (max-width:700px){#mini{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>
<div id="cross"></div>
<div id="load">ORO KITALARI<small id="loadmsg">Arazi yükleniyor…</small></div>

<div id="top" class="panel">
  <button class="t" id="collapse" title="Paneli küçült">–</button>
  <h1>Oro Kıtaları · 3B</h1>
  <div class="body">
    <div class="row">
      <button class="t on" data-mode="orbit">Kuş bakışı</button>
      <button class="t" data-mode="fly">Uçuş</button>
      <button class="t" data-mode="walk">Yürüyüş</button>
    </div>
    <div class="row">
      <button class="t on" id="tLabels">Yer adları</button>
      <button class="t" id="tContours">Eş yükselti</button>
      <button class="t on" id="tTrees">Ağaçlar</button>
    </div>
    <div class="row"><label>Güneş <input type="range" id="sun" min="0" max="1" step="0.01" value="0.32"></label></div>
    <div class="k" id="help"></div>
    <div class="row" style="margin-top:10px"><a href="../">← Külliyat haritasına dön</a></div>
  </div>
</div>
<div id="mini" class="panel"><canvas id="mm"></canvas></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const WORLD_W = 2000, VS = 60;          // world width in units, vertical scale for h
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 9000);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, maxPolarAngle: Math.PI * 0.46, minDistance: 3, maxDistance: 2600, screenSpacePanning: false });
const loadmsg = document.getElementById('loadmsg');

// ---------- sky, light ----------
const skyU = { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(8000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top,horizon,sunDir,sunCol; varying vec3 vD; void main(){ vec3 d=normalize(vD); float t=clamp(d.y*1.7,0.,1.);
    vec3 c=mix(horizon,top,pow(t,.65)); float s=max(dot(d,normalize(sunDir)),0.); c+=sunCol*(pow(s,700.)*2.2+pow(s,10.)*.22); gl_FragColor=vec4(c,1.); }`
}));
scene.add(sky);
scene.fog = new THREE.Fog(0xcfdde6, 700, 4200);
const hemi = new THREE.HemisphereLight(0xe4eef8, 0x6a5a3c, 0.85); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); scene.add(sun);

// ---------- water ----------
const waterU = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { time: { value: 0 }, sunDir: { value: new THREE.Vector3() }, skyC: { value: new THREE.Color() }, sunC: { value: new THREE.Color() } }]);
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, fog: true, depthWrite: false,
  vertexShader: `#include <fog_pars_vertex>
    varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vec4 mvPosition=viewMatrix*w; gl_Position=projectionMatrix*mvPosition;
    #include <fog_vertex>
    }`,
  fragmentShader: `#include <fog_pars_fragment>
    uniform float time; uniform vec3 sunDir,skyC,sunC; varying vec3 vW;
    vec2 wv(vec2 p,vec2 d,float f,float s){ return d*cos(dot(p,d)*f+time*s)*f; }
    void main(){ vec2 p=vW.xz, g=vec2(0.);
      g+=wv(p,normalize(vec2(1.,.3)),.3,1.1)*.05; g+=wv(p,normalize(vec2(-.4,1.)),.7,1.8)*.035;
      g+=wv(p,normalize(vec2(.7,-.8)),1.6,2.6)*.018; g+=wv(p,normalize(vec2(-.9,-.2)),3.4,3.4)*.01;
      vec3 n=normalize(vec3(-g.x,1.,-g.y)), v=normalize(cameraPosition-vW);
      float fr=pow(1.-max(dot(n,v),0.),3.);
      vec3 c=mix(vec3(.09,.32,.42),skyC,fr*.6);
      c+=sunC*pow(max(dot(n,normalize(normalize(sunDir)+v)),0.),240.)*1.3;
      gl_FragColor=vec4(c,mix(.55,.9,fr));
      #include <fog_fragment>
    }`
});

// ---------- clouds ----------
function cloudTex() { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  for (let i = 0; i < 14; i++) { const x = 30 + Math.random() * 68, y = 45 + Math.random() * 38, r = 18 + Math.random() * 26; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const clouds = new THREE.Group(); scene.add(clouds);
const cm = [cloudTex(), cloudTex(), cloudTex()].map(t => new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, opacity: .8 }));

// ---------- data ----------
let W, D, HM, scn;
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function sampleH(u, v) {
  const x = Math.min(Math.max(u, 0), 1) * (HM.w - 1), y = Math.min(Math.max(v, 0), 1) * (HM.h - 1);
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(x0 + 1, HM.w - 1), y1 = Math.min(y0 + 1, HM.h - 1), fx = x - x0, fy = y - y0, A = HM.d, w = HM.w;
  return (A[y0 * w + x0] * (1 - fx) + A[y0 * w + x1] * fx) * (1 - fy) + (A[y1 * w + x0] * (1 - fx) + A[y1 * w + x1] * fx) * fy;
}
const uvToXZ = (u, v) => [u * W - W / 2, v * D - D / 2];
const groundY = (x, z) => sampleH((x + W / 2) / W, (z + D / 2) / D) * VS;

async function init() {
  scn = await (await fetch('scene.json')).json();
  loadmsg.textContent = 'Yükselti okunuyor…';
  const img = await load('height.png');
  const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
  const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
  const px = g.getImageData(0, 0, img.width, img.height).data, [lo, hi] = scn.meta.range;
  HM = { w: img.width, h: img.height, d: new Float32Array(img.width * img.height) };
  for (let i = 0, j = 0; i < HM.d.length; i++, j += 4) HM.d[i] = lo + (px[j] * 256 + px[j + 1]) / 65535 * (hi - lo);
  W = WORLD_W; D = WORLD_W * img.height / img.width;

  loadmsg.textContent = 'Arazi kuruluyor…';
  const tex = await new THREE.TextureLoader().loadAsync('albedo.jpg');
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const sx = 1100, sz = Math.round(sx * D / W);
  const geo = new THREE.PlaneGeometry(W, D, sx, sz); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) pos.setY(i, sampleH(uv.getX(i), 1 - uv.getY(i)) * VS);
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .95, metalness: 0 });
  terrainU.contours = { value: 0 };
  mat.onBeforeCompile = sh => {
    sh.uniforms.contours = terrainU.contours;
    sh.vertexShader = 'varying float vY;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvY = position.y;');
    sh.fragmentShader = 'varying float vY; uniform float contours;\n' + sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
      if (contours > .5 && vY > .05) {
        float s = vY / 1.5; float f = abs(fract(s - .5) - .5) / fwidth(s);
        float major = abs(fract(vY / 7.5 - .5) - .5) / fwidth(vY / 7.5);
        float l = max(1. - smoothstep(.0, 1.1, f), (1. - smoothstep(.0, 1.4, major)) * 1.0);
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * .55 + vec3(.12,.06,.03), l * .55);
      }`);
  };
  scene.add(new THREE.Mesh(geo, mat));
  const water = new THREE.Mesh(new THREE.PlaneGeometry(W * 4, D * 4), waterMat); water.rotation.x = -Math.PI / 2; scene.add(water);

  loadmsg.textContent = 'Ormanlar dikiliyor…';
  buildTrees();
  loadmsg.textContent = 'Şehirler kuruluyor…';
  buildSettlements();
  buildLabels();
  for (let i = 0; i < 60; i++) { const s = new THREE.Sprite(cm[i % 3]); const k = 90 + Math.random() * 170; s.scale.set(k, k * .55, 1); s.position.set((Math.random() - .5) * W * 1.6, 130 + Math.random() * 90, (Math.random() - .5) * D * 1.6); s.userData.v = 2 + Math.random() * 3; clouds.add(s); }
  setupMini();
  resetView();
  const L = document.getElementById('load'); L.style.opacity = 0; setTimeout(() => L.remove(), 700);
}
const terrainU = {};

// ---------- trees ----------
const treeGroup = new THREE.Group(); scene.add(treeGroup);
function treeGeos() {
  const trunk = new THREE.CylinderGeometry(.07, .1, .5, 5); trunk.translate(0, .25, 0);
  const crownB = new THREE.IcosahedronGeometry(.62, 0); crownB.scale(1, .9, 1); crownB.translate(0, 1.05, 0);
  const coneA = new THREE.ConeGeometry(.55, 1.1, 6); coneA.translate(0, .95, 0);
  const coneB = new THREE.ConeGeometry(.42, .9, 6); coneB.translate(0, 1.45, 0);
  const tint = (g, c) => { if (g.index) g = g.toNonIndexed(); const col = new THREE.Color(c); const a = new Float32Array(g.attributes.position.count * 3); for (let i = 0; i < a.length; i += 3) { a[i] = col.r; a[i + 1] = col.g; a[i + 2] = col.b; } g.setAttribute('color', new THREE.BufferAttribute(a, 3)); return g; };
  const wood = '#6b4a2e';
  return [
    mergeGeometries([tint(trunk.clone(), wood), tint(crownB, '#ffffff')]),                       // broadleaf
    mergeGeometries([tint(trunk.clone(), wood), tint(coneA, '#ffffff'), tint(coneB, '#ffffff')]), // conifer
    mergeGeometries([tint(trunk.clone(), wood), tint(coneA.clone().scale(1.1, 1.25, 1.1), '#ffffff')]), // dark spires
    mergeGeometries([tint(trunk.clone(), wood), tint(crownB.clone().scale(1.25, .8, 1.25), '#ffffff')]), // jungle
  ];
}
function buildTrees() {
  const geos = treeGeos(), palettes = [['#4f7a35', '#5f8a3a', '#6b8f3e', '#466c2e'], ['#2f5233', '#36603a', '#3d5f34'], ['#24382a', '#2c4030', '#1f3326'], ['#3f7a2e', '#4d8a34', '#36702a']];
  const byKind = [[], [], [], []]; scn.trees.forEach(t => byKind[t[3]].push(t));
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), c = new THREE.Color();
  byKind.forEach((list, k) => {
    if (!list.length) return;
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .9, flatShading: true });
    const im = new THREE.InstancedMesh(geos[k], mat, list.length);
    list.forEach((t, i) => {
      const [x, z] = uvToXZ(t[0], t[1]);
      const sc = t[2] * 1.15;
      p.set(x, groundY(x, z) - .05, z); q.setFromAxisAngle(up, Math.random() * 6.28); s.set(sc, sc * (0.85 + Math.random() * .4), sc);
      im.setMatrixAt(i, m4.compose(p, q, s));
      im.setColorAt(i, c.set(palettes[k][i % palettes[k].length]).offsetHSL(0, 0, (Math.random() - .5) * .06));
    });
    treeGroup.add(im);
  });
}

// ---------- settlements ----------
const townGroup = new THREE.Group(); scene.add(townGroup);
const SIZES = { capital: [26, 9, 1.35], city: [16, 6.5, 1.15], town: [8, 4, 1], village: [4, 2.6, .9], landmark: [1, 0, 1] };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hash(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function buildSettlements() {
  const body = [], roof = [], tower = [], spire = [], wall = [];
  const desertish = (u, v) => false;
  scn.settlements.forEach(st => {
    const u = st.x / 1600, v = st.y / 1142; const [cx, cz] = uvToXZ(u, v);
    if (groundY(cx, cz) <= 0.05) return;
    const r = rng(hash(st.name || '' + st.x));
    const [n, rad, k] = SIZES[st.size] || SIZES.town;
    const style = (st.style || '').toLowerCase();
    if (/zigur|ziggurat/.test(style) || st.name === 'Ceremo') { zigg(cx, cz); return; }
    if (st.size === 'landmark') {
      if (/tapınak|temple|tample/.test(style)) temple(cx, cz); else tower.push([cx, cz, 1.3, 3.2]);
      return;
    }
    for (let i = 0; i < n; i++) {
      const a = r() * 6.28, d = Math.sqrt(r()) * rad;
      const x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
      const w = (.55 + r() * .45) * k, hgt = (.45 + r() * .55) * k;
      body.push([x, z, w, hgt, w * (.7 + r() * .5), r() * 6.28]);
    }
    const towers = st.size === 'capital' ? 4 : st.size === 'city' ? 2 : st.size === 'town' ? 1 : 0;
    for (let i = 0; i < towers; i++) { const a = r() * 6.28, d = r() * rad * .5; tower.push([cx + Math.cos(a) * d, cz + Math.sin(a) * d, .55 * k, (2.4 + r() * 1.6) * k]); }
    if (st.size === 'capital' || st.size === 'city') {
      const R = rad * 1.15, segs = st.size === 'capital' ? 22 : 14;
      for (let i = 0; i < segs; i++) { const a0 = i / segs * 6.28; wall.push([cx + Math.cos(a0) * R, cz + Math.sin(a0) * R, 2 * Math.PI * R / segs * 1.02, -a0]); }
    }
  });
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0);
  const add = (geo, color, list, fn) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ color, roughness: .85, flatShading: true }), list.length);
    list.forEach((e, i) => { fn(e); im.setMatrixAt(i, m4.compose(p, q, s)); }); townGroup.add(im);
  };
  const box = new THREE.BoxGeometry(1, 1, 1); box.translate(0, .5, 0);
  const pyr = new THREE.ConeGeometry(.75, 1, 4); pyr.rotateY(Math.PI / 4); pyr.translate(0, .5, 0);
  const cyl = new THREE.CylinderGeometry(.5, .55, 1, 8); cyl.translate(0, .5, 0);
  const cone = new THREE.ConeGeometry(.62, 1, 8); cone.translate(0, .5, 0);
  add(box, '#e8dcc0', body, ([x, z, w, h, d, a]) => { p.set(x, groundY(x, z) - .1, z); q.setFromAxisAngle(Y, a); s.set(w, h + .1, d); });
  add(pyr, '#9a3b2a', body, ([x, z, w, h, d, a]) => { p.set(x, groundY(x, z) + h, z); q.setFromAxisAngle(Y, a); s.set(w * 1.05, w * .6, d * 1.05); });
  add(cyl, '#d9ccb0', tower, ([x, z, w, h]) => { p.set(x, groundY(x, z) - .1, z); q.identity(); s.set(w, h, w); });
  add(cone, '#6b2a22', tower, ([x, z, w, h]) => { p.set(x, groundY(x, z) + h - .1, z); q.identity(); s.set(w * 1.15, w * 1.6, w * 1.15); });
  add(box, '#cbbd9e', wall, ([x, z, len, a]) => { p.set(x, groundY(x, z) - .2, z); q.setFromAxisAngle(Y, a); s.set(.35, 1.1, len); });
}
function zigg(cx, cz) {
  const g = new THREE.Group(), base = groundY(cx, cz);
  const mat = new THREE.MeshStandardMaterial({ color: '#e6d6b0', roughness: .8, flatShading: true });
  [[9, 1.4], [7, 1.4], [5.2, 1.4], [3.4, 1.4], [1.8, 1.6]].reduce((y, [w, h]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat); m.position.set(0, y + h / 2, 0); g.add(m); return y + h; }, -.3);
  const top = new THREE.Mesh(new THREE.ConeGeometry(.9, 2.2, 4), new THREE.MeshStandardMaterial({ color: '#c79a3a', metalness: .5, roughness: .4 })); top.position.y = 9.1; top.rotation.y = Math.PI / 4; g.add(top);
  const stair = new THREE.Mesh(new THREE.BoxGeometry(1.4, .25, 6.5), mat); stair.position.set(0, 3.3, 3.6); stair.rotation.x = -.85; g.add(stair);
  g.position.set(cx, base, cz); townGroup.add(g);
}
function temple(cx, cz) {
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: '#efe6d2', roughness: .7, flatShading: true });
  const b = new THREE.Mesh(new THREE.BoxGeometry(3.4, .4, 2.4), mat); b.position.y = .2; g.add(b);
  for (let i = 0; i < 6; i++) for (const zz of [-.9, .9]) { const c = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, 1.6, 6), mat); c.position.set(-1.4 + i * .56, 1.2, zz); g.add(c); }
  const r = new THREE.Mesh(new THREE.ConeGeometry(2.3, .8, 4), mat); r.rotation.y = Math.PI / 4; r.scale.set(1, 1, .7); r.position.y = 2.4; g.add(r);
  g.position.set(cx, groundY(cx, cz), cz); townGroup.add(g);
}

// ---------- labels ----------
const labelsEl = document.getElementById('labels'); let labels = [], showLabels = true;
const FAR = { region: 2800, sea: 3200, lake: 1400, city: 1600, town: 520, mountain: 700, forest: 600, island: 650 };
const LIFT = { region: 26, sea: 4, lake: 3, city: 10, town: 5, mountain: 6, forest: 6, island: 5 };
function buildLabels() {
  labels = scn.labels.map(L => { const [x, z] = uvToXZ(L.u, L.v); const el = document.createElement('div'); el.className = 'lbl ' + L.k; el.textContent = L.t; labelsEl.appendChild(el); return { ...L, x, z, y: Math.max(groundY(x, z), 0) + LIFT[L.k], el }; });
}
const tv = new THREE.Vector3();
function updateLabels() {
  for (const L of labels) {
    tv.set(L.x, L.y, L.z); const dist = camera.position.distanceTo(tv); tv.project(camera);
    const far = FAR[L.k] || 600;
    if (!showLabels || tv.z > 1 || dist > far || Math.abs(tv.x) > 1.05 || Math.abs(tv.y) > 1.05) { if (L.vis !== false) { L.el.style.display = 'none'; L.vis = false; } continue; }
    if (L.vis !== true) { L.el.style.display = 'block'; L.vis = true; }
    const sx = (tv.x * .5 + .5) * innerWidth, sy = (-tv.y * .5 + .5) * innerHeight;
    const sc = Math.max(.7, Math.min(1.15, 300 / dist + .6));
    L.el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-100%) scale(${sc.toFixed(3)})`;
    L.el.style.opacity = Math.min(1, (far - dist) / (far * .3)).toFixed(2);
  }
}

// ---------- minimap ----------
const mm = document.getElementById('mm'), mg = mm.getContext('2d'); let mmImg;
async function setupMini() { mmImg = await load('albedo.jpg'); mm.width = 300; mm.height = Math.round(300 * D / W); }
function drawMini() {
  if (!mmImg) return; mg.drawImage(mmImg, 0, 0, mm.width, mm.height);
  const p = mode === 'orbit' ? controls.target : camera.position, dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  mg.save(); mg.translate((p.x + W / 2) / W * mm.width, (p.z + D / 2) / D * mm.height); mg.rotate(Math.atan2(dir.z, dir.x));
  mg.fillStyle = '#9a2828'; mg.strokeStyle = '#fff'; mg.lineWidth = 1.5; mg.beginPath(); mg.moveTo(9, 0); mg.lineTo(-6, -6); mg.lineTo(-3, 0); mg.lineTo(-6, 6); mg.closePath(); mg.fill(); mg.stroke(); mg.restore();
}
mm.addEventListener('click', e => { const r = mm.getBoundingClientRect(); goTo((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); });

// ---------- navigation ----------
let mode = 'orbit', tween = null; const keys = {};
const player = { pos: new THREE.Vector3(), yaw: 0, pitch: -.1, vy: 0, onGround: false };
function resetView() { setMode('orbit'); const [x, z] = uvToXZ(.55, .52); controls.target.set(x, 0, z); camera.position.set(x, W * .38, z + D * .5); controls.update(); }
function goTo(u, v) {
  const [x, z] = uvToXZ(u, v), gy = Math.max(groundY(x, z), 0);
  if (mode === 'orbit') { const off = camera.position.clone().sub(controls.target); off.setLength(Math.min(Math.max(off.length(), 50), 220)); tween = { t: 0, a: controls.target.clone(), b: new THREE.Vector3(x, gy, z), ca: camera.position.clone(), cb: new THREE.Vector3(x, gy, z).add(off) }; }
  else player.pos.set(x, gy + (mode === 'fly' ? 40 : 2.4), z);
}
function setMode(m) {
  const prev = mode; mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  controls.enabled = m === 'orbit'; document.getElementById('cross').style.display = m === 'orbit' ? 'none' : 'block';
  if (m !== 'orbit' && prev === 'orbit') {
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir); player.yaw = Math.atan2(-dir.x, -dir.z);
    if (m === 'walk') { const t = controls.target; player.pos.set(t.x, Math.max(groundY(t.x, t.z), 0) + 2.4, t.z); player.pitch = -.05; }
    else { player.pos.copy(camera.position); player.pitch = Math.asin(Math.max(-1, Math.min(1, dir.y))); }
  }
  if (m === 'orbit' && prev !== 'orbit') {
    if (document.pointerLockElement) document.exitPointerLock();
    const dir = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), p = player.pos.clone().addScaledVector(dir, 40);
    controls.target.set(p.x, Math.max(groundY(p.x, p.z), 0), p.z); camera.position.copy(player.pos).add(new THREE.Vector3(0, 25, 0)).addScaledVector(dir, -30); controls.update();
  }
  document.getElementById('help').innerHTML = {
    orbit: 'Sürükle: döndür · Sağ tık: kaydır · Tekerlek: yakınlaş · <b>W A S D</b>: gez',
    fly: 'Tıkla: fareyi kilitle · <b>W A S D</b>: uç · <b>Boşluk</b>/<b>C</b>: yüksel/alçal · <b>Shift</b>: hızlı',
    walk: 'Tıkla: fareyi kilitle · <b>W A S D</b>: yürü · <b>Shift</b>: koş · <b>Boşluk</b>: zıpla'
  }[m] + '<br><b>R</b>: başa dön · <b>L</b>: yer adları · <b>K</b>: eş yükselti';
}
let dragging = false;
canvas.addEventListener('mousedown', () => { canvas.focus(); if (mode === 'orbit') return; dragging = true; if (!document.pointerLockElement) { try { const r = canvas.requestPointerLock(); r && r.catch && r.catch(() => {}); } catch (_) {} } });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => { if (mode === 'orbit' || !(document.pointerLockElement === canvas || dragging)) return; player.yaw -= e.movementX * .0022; player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - e.movementY * .0022)); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return; keys[e.code] = true;
  if (e.code === 'Digit1') setMode('orbit'); if (e.code === 'Digit2') setMode('fly'); if (e.code === 'Digit3') setMode('walk');
  if (e.code === 'KeyR') resetView(); if (e.code === 'KeyL') toggle('tLabels'); if (e.code === 'KeyK') toggle('tContours');
  if (e.code === 'Space' && mode === 'walk' && player.onGround) { player.vy = 10; player.onGround = false; }
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function updateNav(dt) {
  if (tween) { tween.t = Math.min(1, tween.t + dt / 1.3); const k = tween.t < .5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2; controls.target.lerpVectors(tween.a, tween.b, k); camera.position.lerpVectors(tween.ca, tween.cb, k); if (tween.t >= 1) tween = null; }
  let f = 0, r = 0; if (keys.KeyW || keys.ArrowUp) f++; if (keys.KeyS || keys.ArrowDown) f--; if (keys.KeyD || keys.ArrowRight) r++; if (keys.KeyA || keys.ArrowLeft) r--;
  const fast = keys.ShiftLeft || keys.ShiftRight;
  if (mode === 'orbit') {
    if (f || r) { const sp = camera.position.distanceTo(controls.target) * .9 * dt * (fast ? 3 : 1), fw = new THREE.Vector3(); camera.getWorldDirection(fw); fw.y = 0; fw.normalize(); const rt = new THREE.Vector3(-fw.z, 0, fw.x); const d = fw.multiplyScalar(f * sp).addScaledVector(rt, r * sp); controls.target.add(d); camera.position.add(d); controls.target.y = Math.max(groundY(controls.target.x, controls.target.z), 0); }
    controls.update(); const minY = Math.max(groundY(camera.position.x, camera.position.z), 0) + 2; if (camera.position.y < minY) camera.position.y = minY; return;
  }
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const look = new THREE.Vector3(fwd.x * Math.cos(player.pitch), Math.sin(player.pitch), fwd.z * Math.cos(player.pitch));
  if (mode === 'fly') {
    const sp = (fast ? 180 : 45) * dt; player.pos.addScaledVector(look, f * sp).addScaledVector(right, r * sp);
    if (keys.Space) player.pos.y += sp; if (keys.KeyC) player.pos.y -= sp;
    player.pos.y = Math.max(Math.max(groundY(player.pos.x, player.pos.z), 0) + 1.5, Math.min(player.pos.y, 900));
  } else {
    const gy = groundY(player.pos.x, player.pos.z), swim = gy < -.6, sp = (swim ? 5 : fast ? 30 : 10) * dt;
    const mv = fwd.clone().multiplyScalar(f).addScaledVector(right, r); if (mv.lengthSq()) mv.normalize().multiplyScalar(sp);
    const nx = player.pos.x + mv.x, nz = player.pos.z + mv.z; if (groundY(nx, nz) - gy < sp * 2.2 || swim) { player.pos.x = nx; player.pos.z = nz; }
    const g2 = groundY(player.pos.x, player.pos.z);
    if (g2 < -.6) { player.pos.y += (.9 - player.pos.y) * Math.min(1, dt * 6); player.vy = 0; player.onGround = true; }
    else { player.vy -= 20 * dt; player.pos.y += player.vy * dt; if (player.pos.y <= g2 + 2.4) { player.pos.y = g2 + 2.4; player.vy = 0; player.onGround = true; } }
    player.pos.x = Math.max(-W / 2, Math.min(W / 2, player.pos.x)); player.pos.z = Math.max(-D / 2, Math.min(D / 2, player.pos.z));
  }
  camera.position.copy(player.pos); camera.lookAt(player.pos.clone().add(look));
}

// ---------- sun ----------
function setSun(t) {
  const a = .15 + t * (Math.PI - .3), el = Math.sin(a) * .95 + .05, dir = new THREE.Vector3(Math.cos(a), el * 1.1, -.45).normalize();
  sun.position.copy(dir).multiplyScalar(1000); const warm = 1 - Math.min(1, el * 1.6);
  sun.color.setHSL(.09, .55 + warm * .3, .92 - warm * .2); sun.intensity = 1.3 + el * 1.4;
  const hz = new THREE.Color().setHSL(.56 - warm * .5, .32 + warm * .3, .84 - warm * .08), top = new THREE.Color().setHSL(.58, .55, .55 + el * .08);
  skyU.top.value.copy(top); skyU.horizon.value.copy(hz); skyU.sunDir.value.copy(dir); skyU.sunCol.value.copy(sun.color);
  scene.fog.color.copy(hz); waterU.sunDir.value.copy(dir); waterU.skyC.value.copy(hz); waterU.sunC.value.copy(sun.color); hemi.intensity = .55 + el * .5;
}

// ---------- UI ----------
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function toggle(id) {
  const b = document.getElementById(id), on = !b.classList.contains('on'); b.classList.toggle('on', on);
  if (id === 'tLabels') showLabels = on;
  if (id === 'tContours') terrainU.contours.value = on ? 1 : 0;
  if (id === 'tTrees') treeGroup.visible = on;
}
['tLabels', 'tContours', 'tTrees'].forEach(id => document.getElementById(id).onclick = () => toggle(id));
document.getElementById('sun').oninput = e => setSun(+e.target.value);
document.getElementById('collapse').onclick = () => { const t = document.getElementById('top'); t.classList.toggle('min'); document.getElementById('collapse').textContent = t.classList.contains('min') ? '+' : '–'; };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setSun(.32); setMode('orbit');
window.oro3d = { camera, controls, goTo, uvToXZ: (u, v) => uvToXZ(u, v), groundY: (x, z) => groundY(x, z) };

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), .1);
  if (HM) { updateNav(dt); waterU.time.value += dt; sky.position.copy(camera.position); for (const c of clouds.children) { c.position.x += c.userData.v * dt; if (c.position.x > W * .8) c.position.x -= W * 1.6; } updateLabels(); drawMini(); }
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
init().catch(e => { loadmsg.textContent = 'Yüklenemedi: ' + e.message; console.error(e); }).finally(frame);
</script>
