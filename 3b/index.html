<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oro Kıtaları 3B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--soot:#120d0a;--bone:#d8cdb4;--blood:#7a1f1a;--rule:#4a1512}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--soot);font-family:'Crimson Pro',Georgia,serif;color:var(--bone)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.panel{position:fixed;background:rgba(18,12,10,.93);border:1px solid var(--rule);border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 0 3px rgba(18,12,10,.93),inset 0 0 0 4px rgba(216,205,180,.1)}
#top{top:14px;left:14px;padding:14px 16px;width:min(320px,calc(100vw - 28px));z-index:5}
#top h1{font-family:'Cinzel',serif;font-weight:600;font-size:16px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px;color:var(--bone)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:7px 0}
button.t{font:inherit;font-size:14.5px;padding:3px 10px;border-radius:2px;border:1px solid rgba(216,205,180,.2);background:rgba(216,205,180,.05);color:var(--bone);cursor:pointer}
button.t.on{background:var(--blood);border-color:#a8362a}
label{font-size:15px;color:#b8ad92}
input[type=range]{width:120px;accent-color:#a8362a;vertical-align:middle}
.k{font-size:14px;line-height:1.4;color:#b8ad92}
.k b{font-family:'Cinzel',serif;font-size:10.5px;border:1px solid var(--rule);border-radius:2px;padding:0 4px;color:var(--bone);font-weight:600}
#top a{color:#b8ad92;font-size:14.5px;text-decoration:none;border-bottom:1px dotted rgba(184,173,146,.5)}
#collapse{position:absolute;top:9px;right:9px;padding:0 8px}
#top.min .body{display:none}
#mini{right:14px;bottom:14px;padding:6px;z-index:5}
#mini canvas{display:block;cursor:crosshair;width:min(230px,36vw);height:auto}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;text-align:center;color:#cfc5aa;transition:opacity .35s;
  text-shadow:0 0 2px #120d0a,0 0 8px rgba(18,13,10,.9),0 1px 0 #120d0a}
.lbl.continent{font-family:'Cinzel',serif;font-weight:700;font-size:40px;letter-spacing:.7em;text-transform:uppercase;color:#f0e6cc;text-shadow:0 0 18px rgba(18,13,10,.85),0 0 3px #120d0a}
.lbl.major{font-family:'Cinzel',serif;font-weight:700;font-size:19px;letter-spacing:.42em;text-transform:uppercase;color:#d8cdb4;padding-bottom:3px;border-bottom:1px solid rgba(216,205,180,.32)}
.lbl.region{font-family:'Cinzel',serif;font-weight:600;font-size:13.5px;letter-spacing:.28em;text-transform:uppercase;color:#c9bfa6}
.lbl.sea{font-family:'Libre Baskerville',serif;font-style:italic;font-size:14.5px;letter-spacing:.34em;text-transform:uppercase;color:#9aa5a0;text-shadow:0 0 6px #0b1419,0 0 2px #0b1419}
.lbl.lake,.lbl.island{font-family:'Libre Baskerville',serif;font-style:italic;font-size:13.5px;color:#9aa5a0;text-shadow:0 0 5px #0b1419,0 0 2px #0b1419}
.lbl.city{font-family:'Libre Baskerville',serif;font-weight:700;font-size:14.5px;color:#e2d7bd}
.lbl.city::before{content:'✠ ';color:#a8362a;text-shadow:0 0 5px #7a1f1a}
.lbl.town{font-size:14.5px;color:#cfc5aa}
.lbl.town::before{content:'· ';color:#a8362a}
.lbl.mountain{font-size:13.5px;font-style:italic;color:#b8b2a6}
.lbl.mountain::before{content:'▲ ';font-size:9px;font-style:normal;color:#6b6360}
.lbl.forest{font-size:13.5px;font-style:italic;color:#8f9a7a}
/* film: vignette, grain, soot speckles (cheap, above the canvas, below the UI) */
#film{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(14,9,6,.22) 82%,rgba(10,6,4,.5) 100%)}
#grain{position:fixed;inset:-50%;pointer-events:none;z-index:2;opacity:.035;mix-blend-mode:overlay;animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(1%,3%)}}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--soot);z-index:10;font-family:'Cinzel',serif;font-weight:600;letter-spacing:.3em;font-size:22px;transition:opacity .8s}
#load::after{content:'';width:180px;height:1px;background:var(--rule)}
#load small{font-family:'Crimson Pro',serif;letter-spacing:.02em;color:#8a7f6a;font-size:16px;font-weight:400}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(216,205,180,.7);box-shadow:0 0 3px #000;display:none;pointer-events:none;z-index:4}

.seal3{position:absolute;left:0;top:0;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;
  background:radial-gradient(circle at 40% 35%,#f3e6c4,#d9c294 75%);box-shadow:0 0 0 1.5px #6a1a14,0 0 0 4px rgba(243,230,196,.85),0 0 0 5px rgba(106,26,20,.6),0 6px 16px rgba(0,0,0,.5)}
.seal3:hover{filter:brightness(1.1)}
.seal3 svg{width:25px;height:25px;fill:none;stroke:#5a1616;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#seals{position:fixed;inset:0;pointer-events:none;z-index:4}
#codex{position:fixed;top:14px;right:14px;bottom:14px;width:min(380px,calc(100vw - 28px));display:none;flex-direction:column;overflow:hidden;z-index:6}
#codex.open{display:flex}
#codex header{padding:16px 18px 12px;border-bottom:1px solid rgba(216,205,180,.12);position:relative}
#codex .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#c9a070}
#codex h2{font-family:'Cinzel',serif;font-weight:600;font-size:21px;margin:4px 0 6px;letter-spacing:.06em}
#codex .desc{font-size:15.5px;line-height:1.45;color:#cdbf9e;margin:0}
#codex .x{position:absolute;top:10px;right:10px}
#codex .body{overflow:auto;padding:4px 12px 16px;flex:1}
.grp{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#c9a070;margin:14px 6px 6px}
.book-grp{display:flex;align-items:center;gap:8px;letter-spacing:.06em;text-transform:none;font-family:'Libre Baskerville',serif;font-size:13px;color:#e3d2ae;border-bottom:1px solid rgba(216,205,180,.1);padding-bottom:5px}
.book-grp i{width:4px;height:15px;flex:none}.book-grp em{margin-left:auto;font-style:normal;color:#a8916c;font-family:'Crimson Pro',serif}
.post{display:grid;grid-template-columns:58px 1fr;gap:11px;padding:9px 8px;color:var(--bone);text-decoration:none;transition:background .15s}
.post:hover{background:rgba(216,205,180,.06)}
.post .thumb{width:58px;height:58px;object-fit:cover;border:1px solid rgba(216,205,180,.15)}
.post .mono{display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:22px;color:#c9a070;background:#24180f}
.post h3{font-family:'Libre Baskerville',serif;font-size:14.5px;margin:0 0 3px;line-height:1.3}
.post .chip{font-size:11.5px;padding:0 6px;display:inline-block;margin-bottom:3px}
.post p{margin:0;font-size:14.5px;line-height:1.35;color:#c4b493;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book{display:grid;grid-template-columns:70px 1fr;gap:12px;margin:8px 6px;padding:10px;border:1px solid #4a1512;background:rgba(122,31,26,.12)}
.book img{width:70px;height:96px;object-fit:cover}
.book h3{font-family:'Cinzel',serif;font-size:16px;margin:0 0 2px}.book .by{font-size:13px;color:#b8ad92}
.book q{display:block;font-style:italic;font-size:14px;color:#cdbf9e;margin:6px 0 8px}
.buy{display:inline-block;padding:5px 14px;background:#7a1f1a;color:#f3e6c4;text-decoration:none;font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.1em;border:1px solid #a8362a}
@media (max-width:700px){#mini{display:none}#codex{top:auto;height:55vh;left:8px;right:8px;bottom:8px;width:auto}}
</style>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="film"></div><canvas id="grain"></canvas>
<div id="labels"></div>
<div id="cross"></div>
<div id="load">ORO KITALARI<small id="loadmsg">Çamur karılıyor…</small></div>

<div id="top" class="panel">
  <button class="t" id="collapse" title="Paneli küçült">–</button>
  <h1>Oro Kıtaları</h1>
  <div class="body">
    <div class="row">
      <button class="t on" data-mode="orbit">Kuş bakışı</button>
      <button class="t" data-mode="fly">Uçuş</button>
      <button class="t" data-mode="walk">Yürüyüş</button>
    </div>
    <div class="row">
      <button class="t on" id="tLabels">Yer adları</button>
      <button class="t" id="tContours">Gravür</button>
      <button class="t on" id="tTrees">Ağaçlar</button>
    </div>
    <div class="row"><label>Saat <input type="range" id="sun" min="0" max="1" step="0.01" value="0.26"></label></div>
    <div class="k" id="help"></div>
    <div class="row" style="margin-top:10px"><a href="../">← Külliyat haritasına dön</a></div>
  </div>
</div>
<div id="seals"></div>
<aside id="codex" class="panel"><header></header><div class="body"></div></aside>
<div id="mini" class="panel"><canvas id="mm"></canvas></div>
<script src="../data.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const WORLD_W = 2000, VS = 62;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.setClearColor(0x120d0a);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 9000);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, maxPolarAngle: Math.PI * 0.45, minDistance: 6, maxDistance: 2600, screenSpacePanning: false });
const loadmsg = document.getElementById('loadmsg');
const sRGB = h => new THREE.Color().setStyle(h, THREE.SRGBColorSpace);

// ---------- light rig: one shared set of colours for terrain, water, objects ----------
const LIGHT = {
  sunDir: { value: new THREE.Vector3(1, 1, -.4).normalize() },
  sunCol: { value: new THREE.Color(1.35, 1.18, .95) },
  shadeCol: { value: new THREE.Color(.34, .34, .44) },
  skyCol: { value: new THREE.Color(.55, .58, .62) },
};
const FOG_HEX = '#b9b3a2';
scene.fog = new THREE.FogExp2(sRGB(FOG_HEX), 0.00017);
const hemi = new THREE.HemisphereLight(sRGB('#c9d4e0'), sRGB('#5a4a34'), 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(sRGB('#ffe2b0'), 2.4); scene.add(sun);
const amb = new THREE.AmbientLight(sRGB('#6a5a48'), 0.45); scene.add(amb);

// ---------- sky: lead lid, ash horizon, sick corona ----------
const skyU = { top: { value: sRGB('#5d7a96') }, horizon: { value: sRGB('#d8c9a4') }, sunDir: LIGHT.sunDir, sunCol: { value: sRGB('#ffe2b0') }, corona: { value: sRGB('#e8c070') } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(8000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform vec3 top, horizon, sunDir, sunCol, corona; varying vec3 vD;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
    void main(){ vec3 d = normalize(vD); float t = clamp(d.y * 1.5, 0., 1.);
      vec3 c = mix(horizon, top, pow(t, .5));
      c *= .93 + .07 * sin(d.y * 40. + d.x * 3.);
      float cl = vn(d.xz / max(d.y, .05) * 1.4) * .6 + vn(d.xz / max(d.y, .05) * 3.1) * .4;
      c = mix(c, mix(c, vec3(1.), .55), smoothstep(.04, .3, d.y) * smoothstep(.5, .8, cl) * .6);
      float s = max(dot(d, normalize(sunDir)), 0.);
      c += sunCol * pow(s, 700.) * 1.1 + sunCol * pow(s, 9.) * .22 + corona * pow(s, 2.) * .07;
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
scene.add(sky);

// ---------- terrain shader ----------
function terrainMaterial(map) {
  const u = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { map: { value: map }, contours: { value: 0 } }]);
  Object.assign(u, LIGHT);
  return new THREE.ShaderMaterial({
    uniforms: u, fog: true,
    vertexShader: `#include <common>
      #include <fog_pars_vertex>
      varying vec2 vUv; varying vec3 vN; varying float vY; varying vec3 vW;
      void main(){ vUv = uv; vN = normal; vY = position.y; vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz;
        vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `#include <common>
      #include <fog_pars_fragment>
      uniform sampler2D map; uniform float contours; uniform vec3 sunDir, sunCol, shadeCol, skyCol;
      varying vec2 vUv; varying vec3 vN; varying float vY; varying vec3 vW;
      void main(){
        vec3 a = texture2D(map, vUv).rgb;
        vec3 n = normalize(vN), L = normalize(sunDir), v = normalize(cameraPosition - vW);
        float w = pow(smoothstep(0., 1., clamp((dot(n, L) + .3) / 1.3, 0., 1.)), 1.35);
        vec3 light = mix(shadeCol, sunCol, w) + skyCol * .22 * (n.y * .5 + .5);
        light *= mix(.55, 1., smoothstep(.25, .85, n.y));           // slope grime
        vec3 c = a * light;
        c += vec3(.08, .085, .09) * pow(1. - max(dot(n, v), 0.), 3.) * (1. - w);        // cold rim
        float wet = 1. - smoothstep(0., 5., vY);
        c += sunCol * pow(max(dot(reflect(-L, n), v), 0.), 24.) * .1 * wet;            // mud glints
        if (contours > .5 && vY > .08) {
          float s = vY / 1.6, f = abs(fract(s - .5) - .5) / fwidth(s);
          float M = vY / 8., fm = abs(fract(M - .5) - .5) / fwidth(M);
          float l = max((1. - smoothstep(0., 1., f)) * .35, (1. - smoothstep(0., 1.2, fm)) * .6);
          c = mix(c, vec3(.06, .045, .035), l * .5);
        }
        float lum = dot(c, vec3(.299, .587, .114));
        c = mix(vec3(lum), c, .92);
        gl_FragColor = vec4(c, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`
  });
}

// ---------- water: black oil, scum, mud tideline ----------
const waterU = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
  time: { value: 0 }, hTex: { value: null }, size: { value: new THREE.Vector2() },
  shallow: { value: sRGB('#4f8f8a') }, mid: { value: sRGB('#1f5a72') }, deep: { value: sRGB('#123a5a') },
  fogC: { value: sRGB(FOG_HEX) }, sunC: { value: sRGB('#ffe2b0') } }]);
waterU.sunDir = LIGHT.sunDir;
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, fog: true, depthWrite: false,
  vertexShader: `#include <common>
    #include <fog_pars_vertex>
    varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <fog_vertex>
    }`,
  fragmentShader: `#include <common>
    #include <fog_pars_fragment>
    uniform float time; uniform sampler2D hTex; uniform vec2 size; uniform vec3 shallow, mid, deep, fogC, sunC, sunDir; varying vec3 vW;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
    vec2 wv(vec2 p, vec2 d, float f, float s){ return d * cos(dot(p, d) * f + time * s) * f; }
    void main(){
      vec2 uv = vec2((vW.x + size.x * .5) / size.x, (vW.z + size.y * .5) / size.y);
      float inside = step(0., uv.x) * step(uv.x, 1.) * step(0., uv.y) * step(uv.y, 1.);
      float h = texture2D(hTex, clamp(uv, 0., 1.)).r;
      float depth = mix(.3, max(-h, 0.), inside);
      vec3 c = mix(shallow, mid, smoothstep(0., .025, depth));
      c = mix(c, deep, smoothstep(.025, .16, depth));
      float dist = length(cameraPosition - vW);
      vec2 p = vW.xz, g = vec2(0.);
      g += wv(p, normalize(vec2(1., .3)), .3, .6) * .02;
      g += wv(p, normalize(vec2(-.4, 1.)), .7, .9) * .015 * exp(-dist / 500.);
      g += wv(p, normalize(vec2(.7, -.8)), 1.7, 1.4) * .007 * exp(-dist / 150.);
      vec3 n = normalize(vec3(-g.x, 1., -g.y)), v = normalize(cameraPosition - vW);
      float fr = pow(1. - max(dot(n, v), 0.), 4.);
      c = mix(c, fogC * .55, fr * .35);
      c += sunC * pow(max(dot(n, normalize(normalize(sunDir) + v)), 0.), 90.) * .45;
      float coast = 1. - smoothstep(0., .03, depth);
      float sc = smoothstep(.58, .78, vn(p * .05 + time * .01) * .6 + vn(p * .13 - time * .015) * .4);
      c = mix(c, vec3(.29, .29, .23) * .55, sc * .35 * coast);
      float band = smoothstep(.6, 1., sin(depth * 500. - time * .9) * .5 + .5) * (1. - smoothstep(0., .012, depth));
      c = mix(c, vec3(.92, .9, .84), band * .35);
      c = mix(c, vec3(.9, .88, .8), (1. - smoothstep(0., .004, depth)) * .55);
      c += vec3(.02, .015, 0.) * sin(depth * 300. + time * .4) * coast;
      gl_FragColor = vec4(c, mix(.9, .975, smoothstep(0., .03, depth)));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`
});

// ---------- post: sepia, desaturation, vignette, grain, edge aberration ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform vec2 res; varying vec2 vUv;
    void main(){
      vec2 d = vUv - .5; float r = length(d);
      float ca = .0006 * r;
      vec3 c = vec3(texture2D(tDiffuse, vUv + d * ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d * ca).b);
      float lum = dot(c, vec3(.299, .587, .114));
      vec3 sep = vec3(lum) * vec3(1.07, .93, .74);
      c = mix(c, sep, .08);
      c = mix(vec3(lum), c, .97);
      c = (c - .18) * 1.04 + .18;
      c *= 1. - smoothstep(.5, 1.05, r * 1.38) * .38;
      float gr = fract(sin(dot(vUv * res + time * 61.7, vec2(12.9898, 78.233))) * 43758.5453) - .5;
      c += gr * .012 * (1. - lum * .6);
      gl_FragColor = vec4(max(c, 0.), 1.);
    }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

// ---------- smoke: banks and columns ----------
function smokeTex(dense) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  for (let i = 0; i < (dense ? 18 : 10); i++) {

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); grade.uniforms.res.value.set(innerWidth, innerHeight); });
setSun(.26); setMode('orbit');
window.oro3d = { camera, controls, goTo, uvToXZ: (u, v) => uvToXZ(u, v), fToXZ: (x, y) => fToXZ(x, y), groundY: (x, z) => groundY(x, z) };

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  if (HM) {
    updateNav(dt); waterU.time.value += dt; grade.uniforms.time.value = t; sky.position.copy(camera.position);
    for (const c of smokeBanks.children) { c.position.x += c.userData.v * dt; if (c.position.x > W * .75) c.position.x -= W * 1.5; }
    for (const s of smokeCols.children) { const u = s.userData; u.life += dt * .045; if (u.life > 1) u.life -= 1; s.position.set(u.x + Math.sin(u.life * 4) * 3 * u.k, u.y + u.life * 60 * u.k, u.z); const k = (6 + u.life * 22) * u.k; s.scale.set(k, k * 1.4, 1); s.material.opacity = .42 * Math.sin(u.life * Math.PI); }
    for (const l of lights) { const u = l.userData; l.material.opacity = u.base * (.8 + .2 * Math.sin(t * 7 + u.ph) * Math.sin(t * 3.1 + u.ph * 2)); if (u.bob) l.position.y = u.y + Math.sin(t * 1.3 + u.ph) * u.bob; }
    for (const s of spinners) s.rotation.y += dt * .4;
    for (const v of portalVeils) v.material.opacity = .22 + .1 * Math.sin(t * 2.3);
    updateLabels(); updateSeals(); drawMini();
  }
  composer.render(); requestAnimationFrame(frame);
}
init().catch(e => { loadmsg.textContent = 'Yüklenemedi: ' + e.message; console.error(e); }).finally(frame);
</script>
</body>
