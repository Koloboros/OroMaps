<!doctype html>
<html lang="tr">
<head>

<title>Oro Kıtaları 3B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(38,13,16,.9);--paper:#efe2c4;--line:rgba(239,226,196,.18);--blood:#9a2828}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bcd3dd;font-family:'Crimson Pro',Georgia,serif;color:var(--paper)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.panel{position:fixed;background:var(--panel);border:1px solid rgba(154,40,40,.7);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#top{top:14px;left:14px;padding:12px 14px;width:min(320px,calc(100vw - 28px))}
#top h1{font-family:'Libre Baskerville',serif;font-size:17px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:7px 0}
button.t{font:inherit;font-size:14.5px;padding:3px 10px;border-radius:4px;border:1px solid var(--line);background:rgba(239,226,196,.06);color:var(--paper);cursor:pointer}
button.t.on{background:var(--blood);border-color:#c2483a}
label{font-size:15px}
input[type=range]{width:120px;accent-color:#c2483a;vertical-align:middle}
.k{font-size:14px;line-height:1.4;color:#d4c19c}
.k b{font-family:'Libre Baskerville',serif;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--paper);font-weight:400}
#top a{color:#cdb991;font-size:14.5px;text-decoration:none;border-bottom:1px dotted rgba(205,185,145,.5)}
#collapse{position:absolute;top:8px;right:8px;padding:0 8px}
#top.min .body{display:none}
#mini{right:14px;bottom:14px;padding:6px}
#mini canvas{display:block;border-radius:4px;cursor:crosshair;width:min(230px,36vw);height:auto}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;text-align:center;color:#2b1a10;transition:opacity .35s;
  text-shadow:0 0 3px rgba(252,246,230,.95),0 0 10px rgba(252,246,230,.65)}
.lbl.continent{font-family:'Libre Baskerville',serif;font-size:34px;letter-spacing:.5em;text-transform:uppercase;color:#4a1a14;text-shadow:0 0 14px rgba(252,246,230,.9),0 0 3px rgba(252,246,230,1)}
.lbl.region{font-family:'Libre Baskerville',serif;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#4a1a14}
.lbl.sea{font-family:'Libre Baskerville',serif;font-style:italic;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#f2fbff;text-shadow:0 0 6px rgba(10,50,80,.6)}
.lbl.lake{font-style:italic;font-size:14.5px;color:#f2fbff;text-shadow:0 0 5px rgba(10,50,80,.7)}
.lbl.city{font-family:'Libre Baskerville',serif;font-size:14.5px;font-weight:700}
.lbl.city::before{content:'◆ ';color:#9a2828;font-size:11px}
.lbl.town{font-size:14.5px}
.lbl.mountain{font-size:13.5px;font-style:italic;color:#3d2c3c}
.lbl.mountain::before{content:'▲ ';font-size:9px;font-style:normal;color:#5a4a5e}
.lbl.forest{font-size:13.5px;font-style:italic;color:#1e3d1a}
.lbl.island{font-size:13.5px;font-style:italic;color:#f2fbff;text-shadow:0 0 5px rgba(10,50,80,.7)}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#2a0f12;z-index:10;font-family:'Libre Baskerville',serif;letter-spacing:.15em;transition:opacity .6s}
#load small{font-family:'Crimson Pro',serif;letter-spacing:0;color:#cdb991;font-size:16px}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 3px #000;display:none;pointer-events:none}
@media (max-width:700px){#mini{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>
<div id="cross"></div>
<div id="load">ORO KITALARI<small id="loadmsg">Arazi yükleniyor…</small></div>

<div id="top" class="panel">
  <button class="t" id="collapse" title="Paneli küçült">–</button>
  <h1>Oro Kıtaları · 3B</h1>
  <div class="body">
    <div class="row">
      <button class="t on" data-mode="orbit">Kuş bakışı</button>
      <button class="t" data-mode="fly">Uçuş</button>
      <button class="t" data-mode="walk">Yürüyüş</button>
    </div>
    <div class="row">
      <button class="t on" id="tLabels">Yer adları</button>
      <button class="t" id="tContours">Eş yükselti</button>
      <button class="t on" id="tTrees">Ağaçlar</button>
    </div>
    <div class="row"><label>Güneş <input type="range" id="sun" min="0" max="1" step="0.01" value="0.3"></label></div>
    <div class="k" id="help"></div>
    <div class="row" style="margin-top:10px"><a href="../">← Külliyat haritasına dön</a></div>
  </div>
</div>
<div id="mini" class="panel"><canvas id="mm"></canvas></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const WORLD_W = 2000, VS = 62;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 9000);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, maxPolarAngle: Math.PI * 0.45, minDistance: 3, maxDistance: 2600, screenSpacePanning: false });
const loadmsg = document.getElementById('loadmsg');

// ---------- shared light state (stylised: warm sun, violet shadows) ----------
const LIGHT = { sunDir: { value: new THREE.Vector3(1, 1, -.4).normalize() }, sunCol: { value: new THREE.Color(1.25, 1.1, .92) }, shadeCol: { value: new THREE.Color(.36, .36, .58) }, skyCol: { value: new THREE.Color(.5, .62, .8) } };

// ---------- sky ----------
const skyU = { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, sunDir: LIGHT.sunDir, sunCol: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(8000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top,horizon,sunDir,sunCol; varying vec3 vD; void main(){ vec3 d=normalize(vD); float t=clamp(d.y*1.6,0.,1.);
    vec3 c=mix(horizon,top,pow(t,.6)); float s=max(dot(d,normalize(sunDir)),0.); c+=sunCol*(pow(s,700.)*2.+pow(s,8.)*.18); gl_FragColor=vec4(c,1.); }`
}));
scene.add(sky);
scene.fog = new THREE.Fog(0xbcd3dd, 900, 4600);
const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x8a7a5a, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.0); scene.add(sun);

// ---------- terrain shader: wrapped light ramp between violet shade and warm sun ----------
const terrainMat = () => new THREE.ShaderMaterial({
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { map: { value: null }, contours: { value: 0 } }]),
  fog: true, lights: false,
  vertexShader: `#include <common>
    #include <logdepthbuf_pars_vertex>
    #include <fog_pars_vertex>
    varying vec2 vUv; varying vec3 vN; varying float vY;
    void main(){ vUv = uv; vN = normal; vY = position.y; vec4 mvPosition = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mvPosition;
      #include <logdepthbuf_vertex>
      #include <fog_vertex>
    }`,
  fragmentShader: `#include <common>
    #include <logdepthbuf_pars_fragment>
    #include <fog_pars_fragment>
    uniform sampler2D map; uniform float contours; uniform vec3 sunDir, sunCol, shadeCol, skyCol;
    varying vec2 vUv; varying vec3 vN; varying float vY;
    void main(){
      #include <logdepthbuf_fragment>
      vec3 a = texture2D(map, vUv).rgb;
      vec3 n = normalize(vN);
      float w = smoothstep(0., 1., clamp((dot(n, normalize(sunDir)) + .42) / 1.42, 0., 1.));
      vec3 light = mix(shadeCol, sunCol, w) + skyCol * .28 * (n.y * .5 + .5);
      vec3 c = a * light;
      if (contours > .5 && vY > .05) {
        float s = vY / 1.6, f = abs(fract(s - .5) - .5) / fwidth(s);
        float M = vY / 8., fm = abs(fract(M - .5) - .5) / fwidth(M);
        float l = max((1. - smoothstep(0., 1., f)) * .6, 1. - smoothstep(0., 1.3, fm));
        c = mix(c, c * .5 + vec3(.1, .05, .06), l * .55);
      }
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`
});

// ---------- water: colour by seabed depth, foam bands at the coast ----------
const waterU = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
  time: { value: 0 }, hTex: { value: null }, range: { value: new THREE.Vector2() }, size: { value: new THREE.Vector2() },
  shallow: { value: new THREE.Color('#7fe0d0') }, mid: { value: new THREE.Color('#2f9ec0') }, deep: { value: new THREE.Color('#1a4f86') }, skyC: { value: new THREE.Color() }, sunC: { value: new THREE.Color() } }]);
waterU.sunDir = LIGHT.sunDir;
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, fog: true, depthWrite: false,
  vertexShader: `#include <common>
    #include <logdepthbuf_pars_vertex>
    #include <fog_pars_vertex>
    varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
    #include <logdepthbuf_vertex>
    #include <fog_vertex>
    }`,
  fragmentShader: `#include <common>
    #include <logdepthbuf_pars_fragment>
    #include <fog_pars_fragment>
    uniform float time; uniform sampler2D hTex; uniform vec2 range, size; uniform vec3 shallow, mid, deep, skyC, sunC, sunDir; varying vec3 vW;
    vec2 wv(vec2 p, vec2 d, float f, float s){ return d * cos(dot(p, d) * f + time * s) * f; }
    void main(){
      #include <logdepthbuf_fragment>
      vec2 uv = vec2((vW.x + size.x * .5) / size.x, (vW.z + size.y * .5) / size.y);
      float inside = step(0., uv.x) * step(uv.x, 1.) * step(0., uv.y) * step(uv.y, 1.);
      float h = mix(range.x, range.y, texture2D(hTex, clamp(uv, 0., 1.)).r);
      float depth = mix(.3, max(-h, 0.), inside);
      vec3 c = mix(shallow, mid, smoothstep(.0, .035, depth));
      c = mix(c, deep, smoothstep(.035, .2, depth));
      vec2 p = vW.xz, g = vec2(0.);
      g += wv(p, normalize(vec2(1., .3)), .3, 1.1) * .04; g += wv(p, normalize(vec2(-.4, 1.)), .7, 1.7) * .03; g += wv(p, normalize(vec2(.7, -.8)), 1.7, 2.6) * .014;
      vec3 n = normalize(vec3(-g.x, 1., -g.y)), v = normalize(cameraPosition - vW);
      float fr = pow(1. - max(dot(n, v), 0.), 4.);
      c = mix(c, skyC, fr * .45);
      c += sunC * pow(max(dot(n, normalize(normalize(sunDir) + v)), 0.), 200.) * .9;
      float coast = 1. - smoothstep(0., .014, depth);
      float band = smoothstep(.55, 1., sin(depth * 900. - time * 1.6) * .5 + .5) * coast;
      c = mix(c, vec3(1.), clamp(band * .55 + (1. - smoothstep(0., .0035, depth)) * .7, 0., 1.));
      gl_FragColor = vec4(c, mix(.82, .97, smoothstep(0., .02, depth)));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`
});

// ---------- clouds ----------
function cloudTex() { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) { const x = 28 + Math.random() * 72, y = 48 + Math.random() * 34, r = 16 + Math.random() * 24; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const clouds = new THREE.Group(); scene.add(clouds);
const cm = [cloudTex(), cloudTex(), cloudTex()].map(t => new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, opacity: .9 }));

// ---------- data ----------
let W, D, HM, scn, terrain;
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function sampleH(u, v) {
  const x = Math.min(Math.max(u, 0), 1) * (HM.w - 1), y = Math.min(Math.max(v, 0), 1) * (HM.h - 1);
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(x0 + 1, HM.w - 1), y1 = Math.min(y0 + 1, HM.h - 1), fx = x - x0, fy = y - y0, A = HM.d, w = HM.w;
  return (A[y0 * w + x0] * (1 - fx) + A[y0 * w + x1] * fx) * (1 - fy) + (A[y1 * w + x0] * (1 - fx) + A[y1 * w + x1] * fx) * fy;
}
const uvToXZ = (u, v) => [u * W - W / 2, v * D - D / 2];
const fToXZ = (x, y) => uvToXZ(x / 1600, y / 1142);
const groundY = (x, z) => sampleH((x + W / 2) / W, (z + D / 2) / D) * VS;

async function init() {
  scn = await (await fetch('scene.json')).json();
  loadmsg.textContent = 'Yükselti okunuyor…';
  const img = await load('height.png');
  const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
  const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
  const px = g.getImageData(0, 0, img.width, img.height).data, [lo, hi] = scn.meta.range;
  HM = { w: img.width, h: img.height, d: new Float32Array(img.width * img.height) };
  for (let i = 0, j = 0; i < HM.d.length; i++, j += 4) HM.d[i] = lo + (px[j] * 256 + px[j + 1]) / 65535 * (hi - lo);
  W = WORLD_W; D = WORLD_W * img.height / img.width;

  loadmsg.textContent = 'Arazi boyanıyor…';
  const tex = await new THREE.TextureLoader().loadAsync('albedo.jpg');
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const sx = 1100, sz = Math.round(sx * D / W);
  const geo = new THREE.PlaneGeometry(W, D, sx, sz); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) pos.setY(i, sampleH(uv.getX(i), 1 - uv.getY(i)) * VS);
  geo.computeVertexNormals();
  const mat = terrainMat(); mat.uniforms.map.value = tex; Object.assign(mat.uniforms, LIGHT);
  terrain = new THREE.Mesh(geo, mat); scene.add(terrain);

  const hTex = new THREE.Texture(img); hTex.colorSpace = THREE.NoColorSpace; hTex.needsUpdate = true; hTex.minFilter = THREE.LinearFilter; hTex.generateMipmaps = false;
  waterU.hTex.value = hTex; waterU.range.value.set(lo * VS, hi * VS).multiplyScalar(1 / VS); waterU.size.value.set(W, D);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(W * 5, D * 5), waterMat); water.rotation.x = -Math.PI / 2; scene.add(water);

  loadmsg.textContent = 'Ormanlar dikiliyor…'; buildTrees();
  loadmsg.textContent = 'Şehirler kuruluyor…'; buildSettlements(); buildLandmarks();
  buildLabels();
  for (let i = 0; i < 46; i++) { const s = new THREE.Sprite(cm[i % 3]); const k = 120 + Math.random() * 200; s.scale.set(k, k * .55, 1); s.position.set((Math.random() - .5) * W * 1.6, 170 + Math.random() * 110, (Math.random() - .5) * D * 1.6); s.userData.v = 2 + Math.random() * 3; clouds.add(s); }
  setupMini(); resetView();
  const L = document.getElementById('load'); L.style.opacity = 0; setTimeout(() => L.remove(), 700);
}

// ---------- forests: puffy canopy clumps, dark spires in conifer stands ----------
const treeGroup = new THREE.Group(); scene.add(treeGroup);
function shadeByHeight(g, top, bottom) {
  if (g.index) g = g.toNonIndexed();
  g.computeBoundingBox(); const y0 = g.boundingBox.min.y, y1 = g.boundingBox.max.y, p = g.attributes.position, a = new Float32Array(p.count * 3), ct = new THREE.Color(top), cb = new THREE.Color(bottom), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { c.lerpColors(cb, ct, (p.getY(i) - y0) / (y1 - y0 || 1)); a.set([c.r, c.g, c.b], i * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3)); g.deleteAttribute('uv'); return g;
}
function treeGeos() {
  const trunk = () => shadeByHeight((() => { const t = new THREE.CylinderGeometry(.07, .11, .55, 5); t.translate(0, .27, 0); return t; })(), '#7a5638', '#5a3d27');
  const puff = (r, x, y, z) => { const s = new THREE.IcosahedronGeometry(r, 1); s.translate(x, y, z); return s; };
  const crown = mergeGeometries([puff(.62, 0, 1.05, 0), puff(.45, .32, .85, .1), puff(.42, -.28, .9, -.15), puff(.38, .05, 1.48, .05)].map(g => g.toNonIndexed()));
  const cone1 = new THREE.ConeGeometry(.5, 1.0, 7); cone1.translate(0, .95, 0);
  const cone2 = new THREE.ConeGeometry(.38, .85, 7); cone2.translate(0, 1.42, 0);
  const cone3 = new THREE.ConeGeometry(.25, .6, 7); cone3.translate(0, 1.82, 0);
  const pine = mergeGeometries([cone1, cone2, cone3].map(g => g.toNonIndexed()));
  return [
    mergeGeometries([trunk(), shadeByHeight(crown.clone(), '#ffffff', '#9a9a9a')]),
    mergeGeometries([trunk(), shadeByHeight(pine.clone(), '#ffffff', '#8a8a8a')]),
    mergeGeometries([trunk(), shadeByHeight(pine.clone().scale(1, 1.35, 1), '#ffffff', '#7a7a7a')]),
    mergeGeometries([trunk(), shadeByHeight(crown.clone().scale(1.25, .85, 1.25), '#ffffff', '#9a9a9a')]),
  ];
}
function buildTrees() {
  const geos = treeGeos();
  const pal = [['#76b648', '#8ac852', '#69a842', '#96cc5c', '#5e9e3e'], ['#4f9460', '#5aa06a', '#468a58'], ['#4a8a6a', '#55977a', '#43806a'], ['#5aaa42', '#6aba4c', '#4f9a40']];
  const byKind = [[], [], [], []]; scn.trees.forEach(t => byKind[t[3]].push(t));
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), c = new THREE.Color();
  byKind.forEach((list, k) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(geos[k], new THREE.MeshLambertMaterial({ vertexColors: true }), list.length);
    list.forEach((t, i) => {
      const [x, z] = uvToXZ(t[0], t[1]), sc = t[2] * 2.5;
      p.set(x, groundY(x, z) - .1, z); q.setFromAxisAngle(up, Math.random() * 6.28); s.set(sc, sc * (.85 + Math.random() * .35), sc);
      im.setMatrixAt(i, m4.compose(p, q, s)); im.setColorAt(i, c.set(pal[k][i % pal[k].length]).offsetHSL(0, 0, (Math.random() - .5) * .05));
    });
    treeGroup.add(im);
  });
}

// ---------- settlements, styled by culture ----------
const townGroup = new THREE.Group(); scene.add(townGroup);
const SIZES = { capital: [46, 17, 2.8], city: [28, 11, 2.4], town: [14, 6.5, 2.1], village: [7, 4, 1.9] };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function hash(str) { let h = 2166136261; for (const ch of String(str)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function inPoly(x, y, ring) { let r = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) r = !r; } return r; }
const CULT_BY_REGION = { ceremo: 'ceremo', derman: 'derman', kavurova: 'desert', payendegan: 'marble', surtunkaya: 'mud', haarbova: 'nomad', pofova: 'slate', vefat: 'dark' };
function cultureAt(x, y) {
  for (const [k, rings] of Object.entries(scn.cultures)) if (CULT_BY_REGION[k] && rings.some(r => inPoly(x, y, r))) return CULT_BY_REGION[k];
  if (x > 1120 && y < 445) return 'ceremo';
  if (x > 1140 && y > 560 && y < 850) return 'gold';
  if (x < 730 && y < 300 && x > 520) return 'dark';
  if (x > 850 && x < 1000 && y > 230 && y < 330) return 'dark';
  return 'generic';
}
// palette per culture: wall, roof, roof kind, tower roof
const KIT = {
  generic: { wall: '#f1e6cc', roof: '#b9553c', roofK: 'pyr', tower: '#7d3a2c', rh: .75 },

function buildLabels() {
  labels = [...CONTINENTS, ...scn.labels].map(L => { const [x, z] = uvToXZ(L.u, L.v); const el = document.createElement('div'); el.className = 'lbl ' + L.k; el.textContent = L.t; el.style.opacity = 0; labelsEl.appendChild(el); return { ...L, x, z, y: Math.max(groundY(x, z), 0) + LIFT[L.k], el, w: 0, h: 0, shown: false }; });

const tv = new THREE.Vector3();

function updateLabels() {

}
let dragging = false;
canvas.addEventListener('mousedown', () => { canvas.focus(); if (mode === 'orbit') return; dragging = true; if (!document.pointerLockElement) { try { const r = canvas.requestPointerLock(); r && r.catch && r.catch(() => {}); } catch (_) {} } });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => { if (mode === 'orbit' || !(document.pointerLockElement === canvas || dragging)) return; player.yaw -= e.movementX * .0022; player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - e.movementY * .0022)); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return; keys[e.code] = true;
  if (e.code === 'Digit1') setMode('orbit'); if (e.code === 'Digit2') setMode('fly'); if (e.code === 'Digit3') setMode('walk');
  if (e.code === 'KeyR') resetView(); if (e.code === 'KeyL') toggle('tLabels'); if (e.code === 'KeyK') toggle('tContours');
  if (e.code === 'Space' && mode === 'walk' && player.onGround) { player.vy = 10; player.onGround = false; }
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function updateNav(dt) {
  if (tween) { tween.t = Math.min(1, tween.t + dt / 1.3); const k = tween.t < .5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2; controls.target.lerpVectors(tween.a, tween.b, k); camera.position.lerpVectors(tween.ca, tween.cb, k); if (tween.t >= 1) tween = null; }
  let f = 0, r = 0; if (keys.KeyW || keys.ArrowUp) f++; if (keys.KeyS || keys.ArrowDown) f--; if (keys.KeyD || keys.ArrowRight) r++; if (keys.KeyA || keys.ArrowLeft) r--;
  const fast = keys.ShiftLeft || keys.ShiftRight;
  if (mode === 'orbit') {
    if (f || r) { const sp = camera.position.distanceTo(controls.target) * .9 * dt * (fast ? 3 : 1), fw = new THREE.Vector3(); camera.getWorldDirection(fw); fw.y = 0; fw.normalize(); const rt = new THREE.Vector3(-fw.z, 0, fw.x); const d = fw.multiplyScalar(f * sp).addScaledVector(rt, r * sp); controls.target.add(d); camera.position.add(d); controls.target.y = Math.max(groundY(controls.target.x, controls.target.z), 0); }
    controls.update(); const minY = Math.max(groundY(camera.position.x, camera.position.z), 0) + 2; if (camera.position.y < minY) camera.position.y = minY; return;
  }
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const look = new THREE.Vector3(fwd.x * Math.cos(player.pitch), Math.sin(player.pitch), fwd.z * Math.cos(player.pitch));
  if (mode === 'fly') {
    const sp = (fast ? 180 : 45) * dt; player.pos.addScaledVector(look, f * sp).addScaledVector(right, r * sp);
    if (keys.Space) player.pos.y += sp; if (keys.KeyC) player.pos.y -= sp;
    player.pos.y = Math.max(Math.max(groundY(player.pos.x, player.pos.z), 0) + 1.5, Math.min(player.pos.y, 900));
  } else {
    const gy = groundY(player.pos.x, player.pos.z), swim = gy < -.6, sp = (swim ? 5 : fast ? 30 : 10) * dt;
    const mv = fwd.clone().multiplyScalar(f).addScaledVector(right, r); if (mv.lengthSq()) mv.normalize().multiplyScalar(sp);
    const nx = player.pos.x + mv.x, nz = player.pos.z + mv.z; if (groundY(nx, nz) - gy < sp * 2.2 || swim) { player.pos.x = nx; player.pos.z = nz; }
    const g2 = groundY(player.pos.x, player.pos.z);
    if (g2 < -.6) { player.pos.y += (.9 - player.pos.y) * Math.min(1, dt * 6); player.vy = 0; player.onGround = true; }
    else { player.vy -= 20 * dt; player.pos.y += player.vy * dt; if (player.pos.y <= g2 + 2.4) { player.pos.y = g2 + 2.4; player.vy = 0; player.onGround = true; } }
    player.pos.x = Math.max(-W / 2, Math.min(W / 2, player.pos.x)); player.pos.z = Math.max(-D / 2, Math.min(D / 2, player.pos.z));
  }
  camera.position.copy(player.pos); camera.lookAt(player.pos.clone().add(look));
}

// ---------- sun ----------
function setSun(t) {
  const a = .15 + t * (Math.PI - .3), el = Math.sin(a) * .95 + .05, dir = new THREE.Vector3(Math.cos(a), el * 1.1, -.45).normalize();
  LIGHT.sunDir.value.copy(dir); sun.position.copy(dir).multiplyScalar(1000);
  const warm = 1 - Math.min(1, el * 1.6);
  sun.color.setHSL(.09, .55 + warm * .3, .9 - warm * .2); sun.intensity = 1.4 + el * 1.2;
  LIGHT.sunCol.value.setRGB(1.22 + warm * .1, 1.08 - warm * .12, .9 - warm * .25);
  LIGHT.shadeCol.value.setRGB(.38 + warm * .08, .36, .58 - warm * .05);
  const hz = new THREE.Color().setHSL(.55 - warm * .48, .35 + warm * .3, .82 - warm * .06), top = new THREE.Color().setHSL(.58, .5, .58 + el * .06);
  skyU.top.value.copy(top); skyU.horizon.value.copy(hz); skyU.sunCol.value.copy(sun.color);
  scene.fog.color.copy(hz); waterU.skyC.value.copy(hz); waterU.sunC.value.copy(sun.color); hemi.intensity = .5 + el * .4;
}

// ---------- UI ----------
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function toggle(id) {
  const b = document.getElementById(id), on = !b.classList.contains('on'); b.classList.toggle('on', on);
  if (id === 'tLabels') showLabels = on;
  if (id === 'tContours' && terrain) terrain.material.uniforms.contours.value = on ? 1 : 0;
  if (id === 'tTrees') treeGroup.visible = on;
}
['tLabels', 'tContours', 'tTrees'].forEach(id => document.getElementById(id).onclick = () => toggle(id));
document.getElementById('sun').oninput = e => setSun(+e.target.value);
document.getElementById('collapse').onclick = () => { const t = document.getElementById('top'); t.classList.toggle('min'); document.getElementById('collapse').textContent = t.classList.contains('min') ? '+' : '–'; };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setSun(.3); setMode('orbit');
window.oro3d = { camera, controls, goTo, uvToXZ: (u, v) => uvToXZ(u, v), fToXZ: (x, y) => fToXZ(x, y), groundY: (x, z) => groundY(x, z) };

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), .1);
  if (HM) { updateNav(dt); waterU.time.value += dt; sky.position.copy(camera.position); for (const c of clouds.children) { c.position.x += c.userData.v * dt; if (c.position.x > W * .8) c.position.x -= W * 1.6; } updateLabels(); drawMini(); }
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
init().catch(e => { loadmsg.textContent = 'Yüklenemedi: ' + e.message; console.error(e); }).finally(frame);
</script>
